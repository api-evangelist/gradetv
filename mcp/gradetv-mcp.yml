note: First-party hosted MCP server on the same host as the REST API. GET /mcp returns a server card (transport,
  protocol version, tool count); an anonymous POST tools/list returned all 46 tools with full inputSchemas,
  saved verbatim to mcp/gradetv-mcp-tools.json. Every tool is a thin proxy over the REST API — the provider's
  llms.txt states "operationId = nome da tool MCP", and all 46 tool names match OpenAPI operationIds exactly
  (see the tool crosswalk). Credentials (X-Guest-Token, Authorization, X-PAYMENT for x402) are passed
  through as headers; the server itself requires no auth to list tools.
