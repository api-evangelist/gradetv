name: Grade
description: A searchable directory of public/free-to-air TV and radio broadcasts (sourced from iptv-org) plus a
  personal, URL-addressable media library with exportable feeds (M3U, M3U8, JSON, XSPF), EPG guide, per-channel
  health scores, and live chat. Exposes a REST API with OpenAPI 3.1, a hosted MCP server, and llms.txt agent docs.
