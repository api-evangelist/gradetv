format: custom-envelope
note: 'Derived from the 4xx/5xx responses declared across all 83 operations. Grade does not use RFC 9457 application/problem+json;
  errors are a plain JSON envelope with a machine `code` (e.g. 403 nsfw_consent_required, 409 recarga_divergente/delta_recusado
  with a problemas[] list). Two shapes matter to agents: 402 responses carry an x402 accepts[] array (pay in USDC
  on Base via the facilitator, then repeat the same call with an X-PAYMENT header), and 429 on POST /api/contact
  documents a Retry-After backoff. Deleting someone else''s comment returns 404, not 403 — ownership is not disclosed.'
