openapi: 3.2.0
info:
  title: GradeTV Play Reports API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Play Reports
paths:
  /api/play-reports:
    get:
      operationId: play_reports
      summary: Reads individual playback reports. Operator access only
      description: 'In current reports, the `ip` field contains an identifier calculated from the network and a secret value. The retention period is in `retention_days`. The public dashboard does not return this identifier.

        Returns: { items[{channel_id,ok,code,ip,browser,os,country,day,at}], limit, offset, next_offset, retention_days, filters{channel_id,only_failures}, api }'
      security:
      - bearerAuth: []
      parameters:
      - name: channel_id
        in: query
        required: false
        schema:
          type: string
        description: Restricts to one channel.
        example: GloboNews.br
      - name: ok
        in: query
        required: false
        schema:
          type: boolean
          enum:
          - '0'
        description: '`0` brings only the failures: it is the segment that matters in an investigation.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Items per page. Above 50, it is silently reduced to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: How many items to skip. Use `next_offset` of the previous answer.
      responses:
        '200':
          description: '{ items[{channel_id,ok,code,ip,browser,os,country,day,at}], limit, offset, next_offset, retention_days, filters{channel_id,only_failures}, api }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeRelatos'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - Play Reports
components:
  schemas:
    Relato:
      type: object
      properties:
        channel_id:
          type: string
          description: Channel that the person tried to watch.
        ok:
          type: boolean
          description: Whether it played (`true`) or failed (`false`).
        code:
          type: string
          description: Failure code, when it failed.
          nullable: true
        ip:
          type: string
          description: In current reports, an identifier calculated from the network and a secret value. The field keeps the name `ip`. The public lookup does not return it.
          nullable: true
        browser:
          type: string
          description: Browser deduced from the User-Agent.
          nullable: true
        os:
          type: string
          description: System deduced from the User-Agent.
          nullable: true
        country:
          type: string
          description: Country deduced by the edge.
          nullable: true
        day:
          type: string
          description: Day of the report (YYYY-MM-DD). It counts up to once per owner, channel, day and result.
        at:
          type: string
          description: Exact time of the report (UTC).
      required:
      - channel_id
      - ok
      - code
      - ip
      - browser
      - os
      - country
      - day
      - at
      description: Individual playback report, available only to the operator.
    PaginaDeRelatos:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Relato'
          description: The reports, from the most recent to the oldest.
        limit:
          type: integer
          description: Applied page size.
        offset:
          type: integer
          description: Deslocamento aplicado.
        next_offset:
          type: integer
          description: Offset of the next page; `null` when it ended.
          nullable: true
        retention_days:
          type: integer
          description: Retention period of the individual reports, in days.
        filters:
          allOf:
          - $ref: '#/components/schemas/FiltrosRelato'
          description: The filters as the server understood them.
        api:
          type: string
          description: URL absoluta desta listagem.
      required:
      - items
      - limit
      - offset
      - next_offset
      - retention_days
      - filters
      - api
      description: Page of individual reports, available only to the operator. Use `next_offset` to continue.
    FiltrosRelato:
      type: object
      properties:
        channel_id:
          type: string
          description: Filtered channel, or `null` for all.
          nullable: true
        only_failures:
          type: boolean
          description: Whether only the failures entered.
      required:
      - channel_id
      - only_failures
      description: What the server understood from the report filter.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
