openapi: 3.2.0
info:
  title: GradeTV Play Report API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Play Report
paths:
  /api/play-report:
    post:
      operationId: report_play
      summary: Tells whether the channel played or failed
      description: 'The first report of this result in the day returns 201. It counts up to once per owner, channel, day and result. Repeating returns 200 with `reason: ja_relatado_hoje`. Browser and system come from the User-Agent. The country comes from the request data. The body cannot change these fields. The reports help to compare results in `GET /api/channels/:id/health`, but they do not confirm the cause of the failure.

        Returns: { ok, counted, reason?, channel_id, stats{plays,fails,favorites,comments,last_fail_code,health,your_plays,your_fails,your_fail_code,your_country_ok,your_country_fail,your_geo_ok,your_latency_ms,your_latency_grade}, health }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_id:
                  type: string
                  description: Channel that you tried to watch.
                ok:
                  type: boolean
                  description: '`true` if it played, `false` if it failed.'
                code:
                  type: string
                  description: Failure code; only when `ok` is `false`. A missing or unknown code enters as `outro`.
                  enum:
                  - cors
                  - geo
                  - sumiu
                  - codec
                  - playlist
                  - sem_resposta
                  - protocolo
                  - sem_stream
                  - embed
                  - outro
              required:
              - channel_id
              - ok
            example:
              channel_id: GloboNews.br
              ok: false
              code: cors
      responses:
        '200':
          description: '{ ok, counted, reason?, channel_id, stats{plays,fails,favorites,comments,last_fail_code,health,your_plays,your_fails,your_fail_code,your_country_ok,your_country_fail,your_geo_ok,your_latency_ms,your_latency_grade}, health }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: 'Always `true`: the report was accepted.'
                  counted:
                    type: boolean
                    description: '`false` when you already reported the same today.'
                  reason:
                    type: string
                    description: Why it did not count; it appears only when `counted` is `false`.
                  channel_id:
                    type: string
                    description: O canal relatado.
                  stats:
                    allOf:
                    - $ref: '#/components/schemas/Social'
                    description: The channel counters with this report already included.
                  health:
                    type: string
                    description: URL of the full health dashboard of this channel.
                required:
                - ok
                - counted
                - channel_id
                - stats
                - health
        '201':
          description: '{ ok, counted, reason?, channel_id, stats{plays,fails,favorites,comments,last_fail_code,health,your_plays,your_fails,your_fail_code,your_country_ok,your_country_fail,your_geo_ok,your_latency_ms,your_latency_grade}, health }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: 'Always `true`: the report was accepted.'
                  counted:
                    type: boolean
                    description: '`false` when you already reported the same today.'
                  reason:
                    type: string
                    description: Why it did not count; it appears only when `counted` is `false`.
                  channel_id:
                    type: string
                    description: O canal relatado.
                  stats:
                    allOf:
                    - $ref: '#/components/schemas/Social'
                    description: The channel counters with this report already included.
                  health:
                    type: string
                    description: URL of the full health dashboard of this channel.
                required:
                - ok
                - counted
                - channel_id
                - stats
                - health
        '400':
          description: Invalid JSON, missing `channel_id`, or `ok` other than `true` or `false`.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '404':
          description: Channel not found in the catalog.
      tags:
      - Play Report
components:
  schemas:
    Social:
      type: object
      properties:
        plays:
          type: integer
          description: Reports that the channel played.
        fails:
          type: integer
          description: Reports that the channel failed.
        favorites:
          type: integer
          description: 'How many people marked it as favorite: it counts people, not clicks.'
        comments:
          type: integer
          description: Public comments on the channel.
        last_fail_code:
          type: string
          description: Code of the most recent reported failure.
          nullable: true
        health:
          type: integer
          description: Success percentage; `null` while there are fewer than 3 reports.
          nullable: true
        your_plays:
          type: integer
          description: Success reports in YOUR browser, system and country.
        your_fails:
          type: integer
          description: 'Failure reports in your environment: this is what tells ''down'' from ''blocked for you''.'
        your_fail_code:
          type: string
          description: Code of the last failure in your environment.
          nullable: true
        your_country_ok:
          type: integer
          description: Success reports in YOUR country, without a split by browser/OS.
        your_country_fail:
          type: integer
          description: Failure reports in your country.
        your_geo_ok:
          type: boolean
          description: '`false` = all the attempts reported in your country failed (a suspected geo-block); `null` without enough reports.'
          nullable: true
        your_latency_ms:
          type: integer
          description: Average playlist latency measured at the hop, at the edge of your country; `null` without a measurement.
          nullable: true
        your_latency_grade:
          type: string
          description: '`otima`, `boa`, `lenta` or `ruim`; `null` without a measurement.'
          nullable: true
      required:
      - plays
      - fails
      - favorites
      - comments
      - last_fail_code
      - health
      - your_plays
      - your_fails
      - your_fail_code
      - your_country_ok
      - your_country_fail
      - your_geo_ok
      - your_latency_ms
      - your_latency_grade
      description: Community counters about a channel, including the extract for the environment and the country of the requester.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
