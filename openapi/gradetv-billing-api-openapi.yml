openapi: 3.2.0
info:
  title: GradeTV Billing API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Billing
paths:
  /api/billing:
    get:
      operationId: billing
      summary: Prices in force, gallery caps and the full x402 configuration
      description: 'It is the number IN FORCE: read it from here before you spend a call, instead of assuming the price of the documentation. With a credential, it also tells whether the chat pass of the person who speaks in the chat (the guest; without one, the account) is active. `prices.abuso_24h_usd` is the price of the gate for an empty UA/curl, off today.

        Returns: { provider, mode, network, chain_id, pay_to, homolog, dev, dev_gate, alternavel, gratis?, cobrados?, facilitator, asset, asset_address, faucet, wallets, product, prices{chat_month_usd,abuso_24h_usd}, chat{active,until}, limits{categories,groups_per_category,items_per_group} }'
      security: []
      responses:
        '200':
          description: '{ provider, mode, network, chain_id, pay_to, homolog, dev, dev_gate, alternavel, gratis?, cobrados?, facilitator, asset, asset_address, faucet, wallets, product, prices{chat_month_usd,abuso_24h_usd}, chat{active,until}, limits{categories,groups_per_category,items_per_group} }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
      tags:
      - Billing
components:
  schemas:
    Precos:
      type: object
      properties:
        chat_month_usd:
          type: number
          description: Cost of the chat pass per 30 days.
        abuso_24h_usd:
          type: number
          description: Price of the gate for an empty UA or curl (off).
      required:
      - chat_month_usd
      - abuso_24h_usd
      description: Prices in force, in dollars. Read them from here, not from the documentation.
    TetosGaleria:
      type: object
      properties:
        categories:
          type: integer
          description: Pastas por dono.
        groups_per_category:
          type: integer
          description: Sub-abas por pasta.
        items_per_group:
          type: integer
          description: Canais por sub-aba.
      required:
      - categories
      - groups_per_category
      - items_per_group
      description: 'The limits of the personal gallery: they exist so that the public catalog is not dumped into a library.'
    Passe:
      type: object
      properties:
        active:
          type: boolean
          description: Whether the pass is valid at this moment.
        until:
          type: string
          description: Until when it is valid (UTC); `null` without a pass, or with the chat open for free (`X402_GRATIS`).
          nullable: true
      required:
      - active
      - until
      description: 'Monthly chat pass: the `chat_pass` `direito` of the speaker, in the global purchase record.'
    Billing:
      type: object
      properties:
        provider:
          type: string
          description: 'Always `x402`: it is the only accepted billing protocol.'
        mode:
          type: string
          description: 'Seller mode: `live` charges for real, `dev` releases without payment.'
        network:
          type: string
          description: 'USDC network: `base` in production, `base-sepolia` in staging.'
        chain_id:
          type: integer
          description: EVM chain ID of the network above, so that the wallet signs on the correct chain.
        pay_to:
          type: string
          description: Address that receives the payment.
          nullable: true
        homolog:
          type: boolean
          description: 'Staging seam enabled: you can close the loop without spending USDC.'
        dev:
          type: boolean
          description: 'Development mode: the 402 is simulated.'
        dev_gate:
          type: boolean
          description: A staging credential is configured; it does not grant access.
        alternavel:
          type: boolean
          description: 'Only in dev: the request with `X-MM-Pagamento: real` pays for real instead of the test.'
        gratis:
          type: array
          items:
            type: string
          description: SKUs temporariamente gratuitos.
        cobrados:
          type: array
          items:
            type: string
          description: SKUs charged even with `*` in `gratis`.
        facilitator:
          type: string
          description: URL of the facilitator that verifies and settles the payment.
        asset:
          type: string
          description: 'Accepted currency: always `USDC`.'
        asset_address:
          type: string
          description: USDC contract on the network above.
        faucet:
          type: string
          description: Test USDC faucet; only on base-sepolia.
          nullable: true
        wallets:
          type: object
          description: Links to wallets that speak x402 (metamask, coinbase, base_app).
        product:
          type: string
          description: Name of the product that is charging.
        prices:
          allOf:
          - $ref: '#/components/schemas/Precos'
          description: How much each paid action costs, in USD.
        chat:
          allOf:
          - $ref: '#/components/schemas/Passe'
          description: Your chat pass; without a credential it comes inactive.
        limits:
          allOf:
          - $ref: '#/components/schemas/TetosGaleria'
          description: How many folders, sub-tabs and channels fit.
      required:
      - provider
      - mode
      - network
      - chain_id
      - pay_to
      - homolog
      - dev
      - dev_gate
      - alternavel
      - facilitator
      - asset
      - asset_address
      - faucet
      - wallets
      - product
      - prices
      - chat
      - limits
      description: 'Everything that decides if a call will cost money: the x402 configuration, the product prices, your pass and the gallery caps.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
