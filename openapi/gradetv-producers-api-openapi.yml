openapi: 3.2.0
info:
  title: GradeTV Producers API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Producers
paths:
  /api/producers:
    get:
      operationId: producer_services
      summary: Offer on request for producers with authorized content, and contact channels
      description: 'Information and interest capture only. It does not provision, charge or activate a broadcast. Use contact.form_url in the browser, contact.email by e-mail or POST /api/contact to present the project. Sending is open, with no captcha or payment, one message every 10 s per network.

        Returns: { status, activation_available, title, description, audience, services, requirements, availability, pricing, contact, _links }'
      security: []
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          default: pt
          enum:
          - pt
          - en
          - es
          - fr
          - de
          - hu
        description: 'Language of the offer: pt, en, es, fr, de or hu; missing or unknown falls back to pt.'
      responses:
        '200':
          description: '{ status, activation_available, title, description, audience, services, requirements, availability, pricing, contact, _links }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: '`sob_consulta`: a proposal subject to individual evaluation.'
                  activation_available:
                    type: boolean
                    description: 'Always false: there is no broadcast activation on this surface.'
                  title:
                    type: string
                    description: Offer name in the requested language.
                  description:
                    type: string
                    description: Presentation of the service on request.
                  audience:
                    type: string
                    description: Profile of the producers and organizations that the proposal serves.
                  services:
                    type: array
                    items:
                      type: string
                    description: Capabilities to evaluate in the project, with no availability commitment.
                  requirements:
                    type: string
                    description: Need of authorization for the signal and the works, territory and term.
                  availability:
                    type: string
                    description: Evaluation condition before confirming the start and the scope.
                  pricing:
                    type: string
                    description: Quote on request; sending interest does not hire the service.
                  contact:
                    type: object
                    description: Absolute email, form_url and api_url, message_template and instructions to present the channel/event, rights, audience, duration and date.
                  _links:
                    type: object
                    description: 'self (this API with the language) and page (offer page): absolute URLs.'
                required:
                - status
                - activation_available
                - title
                - description
                - audience
                - services
                - requirements
                - availability
                - pricing
                - contact
                - _links
        '405':
          description: The offer accepts only GET; there is no provisioning by POST.
      tags:
      - Producers
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
x-provenance:
