openapi: 3.2.0
info:
  title: GradeTV Categories API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Categories
paths:
  /api/categories:
    get:
      operationId: get_api_categories
      summary: Category vocabulary of the catalog, with an icon for the interface
      description: 'Note that `POST /api/categories` is something else: it creates a folder in the owner''s library.

        Returns: { items[{id,name,description,icon}] }'
      security: []
      responses:
        '200':
          description: '{ items[{id,name,description,icon}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaCategoria'
      tags:
      - Categories
    post:
      operationId: create_category
      summary: Creates a folder in the gallery, already with the General sub-tab inside it
      description: 'Cap of 8 folders per owner. The answer has the whole updated library, so you do not need to reload `GET /api/library` after.

        Returns: { owner, feeds{m3u,m3u8,json,xspf}, categories[{id,name,slug,sort,last_group_id,api,feeds,groups}], id, name, slug, group_id }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Folder name, up to 40 characters.
              required:
              - name
            example:
              name: Notícias
      responses:
        '200':
          description: '{ owner, feeds{m3u,m3u8,json,xspf}, categories[{id,name,slug,sort,last_group_id,api,feeds,groups}], id, name, slug, group_id }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibliotecaComPasta'
        '400':
          description: Empty or too long name, or the cap of 8 folders was reached.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - Categories
  /api/categories/{id}:
    patch:
      operationId: patch_api_categories_by_id
      summary: Renames a folder. The feed slug follows the new name
      description: 'Note: changing the name changes the slug, and therefore changes the feed URL of that folder. Anyone who already pasted the old link in the player must paste the new one.

        Returns: { owner, feeds{m3u,m3u8,json,xspf}, categories[{id,name,slug,sort,last_group_id,api,feeds,groups}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Folder ID, `cat_…`.
        example: cat_123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New folder name, up to 40 characters.
              required:
              - name
            example:
              name: Jornalismo
      responses:
        '200':
          description: '{ owner, feeds{m3u,m3u8,json,xspf}, categories[{id,name,slug,sort,last_group_id,api,feeds,groups}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Biblioteca'
        '400':
          description: Name empty or too long.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '404':
          description: 'The resource does not exist (or it is not yours: the API does not tell the two apart, on purpose).'
      tags:
      - Categories
    delete:
      operationId: delete_api_categories_by_id
      summary: 'Deletes the folder and everything inside it: sub-tabs and channels'
      description: 'Returns: { owner, feeds{m3u,m3u8,json,xspf}, categories[{id,name,slug,sort,last_group_id,api,feeds,groups}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Folder ID, `cat_…`.
        example: cat_123
      responses:
        '200':
          description: '{ owner, feeds{m3u,m3u8,json,xspf}, categories[{id,name,slug,sort,last_group_id,api,feeds,groups}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Biblioteca'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '404':
          description: 'The resource does not exist (or it is not yours: the API does not tell the two apart, on purpose).'
      tags:
      - Categories
components:
  schemas:
    ListaCategoria:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Categoria'
          description: All the items; these routes do not paginate.
      required:
      - items
      description: 'Small, complete collection: a catalog facet that fits whole in one answer.'
    ItemBiblioteca:
      type: object
      properties:
        id:
          type: string
          description: Item ID in the library, `itm_…`.
        channel_id:
          type: string
          description: Channel ID in the catalog, e.g. `GloboNews.br`.
        stream_id:
          type: string
          description: Stream chosen for this item.
          nullable: true
        name:
          type: string
          description: Channel name; it falls back to the `channel_id` if the channel left the catalog.
        logo_url:
          type: string
          description: Logo served by us.
          nullable: true
        url:
          type: string
          description: Playback URL at the hop; `null` when the stream disappeared.
          nullable: true
        quality:
          type: string
          description: Quality of the chosen stream.
          nullable: true
        kind:
          type: string
          description: 'Media type: `hls`, `mpd`, `mp4`…'
        playable_hint:
          type: boolean
          description: Whether the last check found the stream usable.
        stale:
          type: boolean
          description: '`true` when the channel or the stream disappeared from the source: the item stays, without playing.'
        sort:
          type: integer
          description: Position within the sub-tab.
      required:
      - id
      - channel_id
      - stream_id
      - name
      - logo_url
      - url
      - quality
      - kind
      - playable_hint
      - stale
      - sort
      description: A channel inside a sub-tab, with the stream already chosen.
    PastaBiblioteca:
      type: object
      properties:
        id:
          type: string
          description: Folder ID, `cat_…`.
        name:
          type: string
          description: Name that the owner gave.
        slug:
          type: string
          description: Version of the name used in the feed URL.
        sort:
          type: integer
          description: Position in the owner's sort order.
        last_group_id:
          type: string
          description: 'Last opened sub-tab: this is what returns the person to where they stopped.'
          nullable: true
        api:
          type: string
          description: URL absoluta desta pasta.
        feeds:
          allOf:
          - $ref: '#/components/schemas/Feeds'
          description: Feeds of this folder only.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SubAba'
          description: Sub-tabs inside the folder.
      required:
      - id
      - name
      - slug
      - sort
      - last_group_id
      - api
      - feeds
      - groups
      description: Folder (main tab) of the owner's gallery.
    Biblioteca:
      type: object
      properties:
        owner:
          type: string
          description: 'Label derived from the owner of this tree: stable while the feed is the same, and not reversible. It is NOT the guest token or the account ID: the token is the master credential, without revocation, and the label is derived from it with the feed token.'
        feeds:
          allOf:
          - $ref: '#/components/schemas/Feeds'
          description: Feeds of the whole library, in four formats.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PastaBiblioteca'
          description: The owner's folders, in the order the owner set.
      required:
      - owner
      - feeds
      - categories
      description: 'The owner''s whole gallery: folders, sub-tabs, channels and the feed URLs of each level.'
    Feeds:
      type: object
      properties:
        m3u:
          type: string
          description: 'M3U playlist: this is what you paste in VLC.'
        m3u8:
          type: string
          description: The same playlist, with the `.m3u8` extension for players that accept only it.
        json:
          type: string
          description: The same list in JSON, for those who build on it.
        xspf:
          type: string
          description: The same list in XSPF, for players that prefer XML.
      required:
      - m3u
      - m3u8
      - json
      - xspf
      description: 'The same content in four formats. They are public URLs, with the feed token in the path: whoever has the link has the content.'
    BibliotecaComPasta:
      type: object
      properties:
        owner:
          type: string
          description: 'Label derived from the owner of this tree: stable while the feed is the same, and not reversible. It is NOT the guest token or the account ID: the token is the master credential, without revocation, and the label is derived from it with the feed token.'
        feeds:
          allOf:
          - $ref: '#/components/schemas/Feeds'
          description: Feeds of the whole library, in four formats.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PastaBiblioteca'
          description: The owner's folders, in the order the owner set.
        id:
          type: string
          description: ID of the created folder, `cat_…`.
        name:
          type: string
          description: Name of the created folder.
        slug:
          type: string
          description: 'Folder slug: it is what enters the feed URL of the folder.'
        group_id:
          type: string
          description: ID of the General sub-tab, created with the folder.
      required:
      - owner
      - feeds
      - categories
      - id
      - name
      - slug
      - group_id
      description: The whole library plus the IDs of the folder just created.
    SubAba:
      type: object
      properties:
        id:
          type: string
          description: Sub-tab ID, `grp_…`.
        name:
          type: string
          description: Name that the owner gave.
        slug:
          type: string
          description: Version of the name used in the feed URL.
        sort:
          type: integer
          description: Sort position within the folder.
        last_item_id:
          type: string
          description: Last channel played in this sub-tab.
          nullable: true
        api:
          type: string
          description: URL absoluta desta sub-aba.
        feeds:
          allOf:
          - $ref: '#/components/schemas/Feeds'
          description: Feeds of this sub-tab only.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemBiblioteca'
          description: Channels placed here, in the owner's order.
      required:
      - id
      - name
      - slug
      - sort
      - last_item_id
      - api
      - feeds
      - items
      description: Sub-tab inside a folder; it is the level that groups the channels.
    Categoria:
      type: object
      properties:
        id:
          type: string
          description: Category ID, e.g. `movies`.
        name:
          type: string
          description: Display name.
        description:
          type: string
          description: What the category covers, according to the source.
          nullable: true
        icon:
          type: string
          description: Name of the icon used in the interface.
          nullable: true
      required:
      - id
      - name
      - description
      - icon
      description: Category of the catalog vocabulary, without a count.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
