openapi: 3.2.0
info:
  title: GradeTV Nsfw API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Nsfw
paths:
  /api/nsfw/pass:
    get:
      operationId: get_api_nsfw_pass
      summary: 'Retired: it read the adult content pass. It answers 410'
      description: 'Adult content left the Grade on 17/09/2026 and does not come back through a pass, consent, flag or ticket (`is_nsfw` stays as an internal classification, to exclude the channel from every read).

        Returns: 410 `adult_content_removed`, always.'
      security: []
      responses:
        '200':
          description: 410 `adult_content_removed`, always.
        '410':
          description: 'Always: there is no adult pass.'
      tags:
      - Nsfw
    post:
      operationId: post_api_nsfw_pass
      summary: 'Retired: it bought the adult content pass. It answers 410'
      description: 'Adult content left the Grade on 17/09/2026 and does not come back through a pass, consent, flag or ticket (`is_nsfw` stays as an internal classification, to exclude the channel from every read).

        Returns: 410 `adult_content_removed`, always.'
      security: []
      responses:
        '200':
          description: 410 `adult_content_removed`, always.
        '410':
          description: 'Always: there is no adult pass.'
      tags:
      - Nsfw
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
