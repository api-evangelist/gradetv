openapi: 3.2.0
info:
  title: GradeTV Admin API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Admin
paths:
  /api/admin/catalogo/estado:
    get:
      operationId: get_api_admin_catalogo_estado
      summary: Counts of the live catalog and of the staging, plus the stamp of the last reload
      description: '`CATALOGO_TOKEN` credential. Diagnosis of the published state.

        Returns: { live{channels,channels_fts,channels_fts_ids,streams,blocklist,facet_countries,facet_categories,facet_languages,facet_subdivisions,facet_cities}, staging{channels,channels_fts,channels_fts_ids,streams,blocklist,facet_countries,facet_categories,facet_languages,facet_subdivisions,facet_cities}, meta{synced_at,applied_at,dump_sha256,staging_run} }'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ live{channels,channels_fts,channels_fts_ids,streams,blocklist,facet_countries,facet_categories,facet_languages,facet_subdivisions,facet_cities}, staging{channels,channels_fts,channels_fts_ids,streams,blocklist,facet_countries,facet_categories,facet_languages,facet_subdivisions,facet_cities}, meta{synced_at,applied_at,dump_sha256,staging_run} }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoCatalogo'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '503':
          description: '`CATALOGO_TOKEN` is not configured in the Worker: the reload is off.'
      tags:
      - Admin
  /api/admin/catalogo/slugs:
    get:
      operationId: get_api_admin_catalogo_slugs
      summary: 'Published slug of each channel, paginated by ID: the reload inherits it so that…'
      description: 'Keyset by `id`: repeat with `apos` = `next_after` until it comes as `null`.

        Returns: { items[{id,slug}], next_after }'
      security:
      - bearerAuth: []
      parameters:
      - name: apos
        in: query
        required: false
        schema:
          type: string
        description: 'Cursor: it returns only IDs greater than this one (the `next_after` of the previous page).'
        example: GloboRJ.br
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size; cap of 5000.
        example: 5000
      responses:
        '200':
          description: '{ items[{id,slug}], next_after }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugsPublicados'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '503':
          description: Reload off (without `CATALOGO_TOKEN`).
      tags:
      - Admin
  /api/admin/catalogo/inicio:
    post:
      operationId: post_api_admin_catalogo_inicio
      summary: Opening staging was retired and answers 410
      description: 'No body reactivates staging, deletes data or recreates indexes. The load accepts only a difference with a budget; a lost state requires an explicit restore.

        Returns: 410 `recarga_completa_bloqueada`, after authentication.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 410 `recarga_completa_bloqueada`, after authentication.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '410':
          description: 'Always: protocol retired.'
      tags:
      - Admin
  /api/admin/catalogo/lote:
    post:
      operationId: post_api_admin_catalogo_lote
      summary: Sending a batch to staging was retired and answers 410
      description: 'No body reactivates staging, deletes data or recreates indexes. The load accepts only a difference with a budget; a lost state requires an explicit restore.

        Returns: 410 `recarga_completa_bloqueada`, after authentication.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 410 `recarga_completa_bloqueada`, after authentication.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '410':
          description: 'Always: protocol retired.'
      tags:
      - Admin
  /api/admin/guia/lote:
    post:
      operationId: post_api_admin_guia_lote
      summary: Records the schedule day of up to 500 channels in `guia_dia` (INSERT OR REPLACE)
      description: 'Publishing is restricted to the operations credential. One channel per line; programs out of order are sorted, and programs without a title or with inverted times are dropped; a channel JSON above 128 KiB refuses the request with the index.

        Returns: { ok, day, gravados }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day:
                  type: string
                  description: Dia grabado, `YYYY-MM-DD`.
                canais:
                  type: array
                  items:
                    type: object
                  description: '`{ channel_id, site, programas: [{ inicio, fim, titulo, desc?, categoria? }] }`, ISO 8601 instants. Cap of 500 per request.'
              required:
              - day
              - canais
            example:
              day: '2026-09-04'
              canais:
              - channel_id: RecordNews.br
                site: programacao.example
                programas:
                - inicio: '2026-09-04T09:00:00Z'
                  fim: '2026-09-04T10:00:00Z'
                  titulo: Jornal da Record
      responses:
        '200':
          description: '{ ok, day, gravados }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaLoteGravado'
        '400':
          description: Malformed `day`, empty `canais` or an invalid channel (the index and the reason come in the message).
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '413':
          description: More than 500 channels in one request.
      tags:
      - Admin
  /api/admin/guia/fim:
    post:
      operationId: post_api_admin_guia_fim
      summary: Records the `guia` source in `catalog_meta.fontes`, next to the catalog sources
      description: 'Closes the grabber round: `fetched_at`, `itens` (channels, sites, programs…), `stale`, `ausente`. It is what `GET /api/health` shows in `sources.guia` (limit of 2 days) and what the smoke test requires when the source is fresh.

        Returns: { ok, guia }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registro:
                  type: object
                  description: 'The same `fontes` format as the swap: `fetched_at`, `sha256` (can be null), `itens`, `stale`, `ausente`, `motivo`.'
              required:
              - registro
            example:
              registro:
                fetched_at: '2026-09-04T03:20:00Z'
                sha256: null
                itens:
                  canais: 64
                  sites: 2
                stale: false
                ausente: false
      responses:
        '200':
          description: '{ ok, guia }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaRegistrada'
        '400':
          description: Record with a field of the wrong type.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - Admin
  /api/admin/logos/mortas:
    get:
      operationId: get_api_admin_logos_mortas
      summary: TV channels whose logo origin died (the cron already failed to fetch it) and…
      description: 'Lookup restricted to operations, to identify unavailable logos.

        Returns: { items, limit }'
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 2000
        description: How many channels to return (limit 5000).
      responses:
        '200':
          description: '{ items, limit }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogosMortas'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - Admin
  /api/admin/logos/overrides:
    post:
      operationId: post_api_admin_logos_overrides
      summary: Updates the logo shown in the channel record
      description: 'Only https. It survives the reload (the table stays out of the swap). The source attribution appears at `/sobre`.

        Returns: { ok, fonte, gravados }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fonte:
                  type: string
                  description: Identifier for attribution.
                itens:
                  type: array
                  items:
                    type: object
                  description: '`{ channel_id, url }`; cap of 500 per request.'
              required:
              - fonte
              - itens
            example:
              fonte: licenciante
              itens:
              - channel_id: BandNews.br
                url: https://logos.example/canal.png
      responses:
        '200':
          description: '{ ok, fonte, gravados }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverridesGravados'
        '400':
          description: Malformed `fonte`, empty list or an item without `channel_id`/https (the index comes in the message).
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '413':
          description: More than 500 items.
      tags:
      - Admin
  /api/admin/catalogo/troca:
    post:
      operationId: post_api_admin_catalogo_troca
      summary: The full catalog swap was retired and answers 410
      description: 'No body reactivates staging, deletes data or recreates indexes. The load accepts only a difference with a budget; a lost state requires an explicit restore.

        Returns: 410 `recarga_completa_bloqueada`, after authentication.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 410 `recarga_completa_bloqueada`, after authentication.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '410':
          description: 'Always: protocol retired.'
      tags:
      - Admin
  /api/admin/catalogo/delta/inicio:
    post:
      operationId: post_api_admin_catalogo_delta_inicio
      summary: 'Opens the differential reload: guard against the live catalog and the run mark'
      description: 'The same guard as the swap, before touching any row: zero channels, zero streams, zero playable or less than half of what is live is refused (409, `delta_recusado`). Leftover staging is refused and the data is kept. `recarga_id` stays in `catalog_meta.staging_run`. Start, batches and end share a cap of 100 thousand rows written per UTC day, including indexes and control; an atomic CHECK refuses before the effect.

        Returns: { ok, recarga_id, live{channels,channels_fts,channels_fts_ids,streams,blocklist,facet_countries,facet_categories,facet_languages,facet_subdivisions,facet_cities} }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recarga_id:
                  type: string
                  description: Identifier of this run (4–64 of `[A-Za-z0-9._-]`); the next requests apply only to the reload that it opened.
                esperado:
                  type: object
                  description: Table → how many rows the WHOLE catalog will have after the difference (`channels_fts` counts distinct IDs), plus `playable` (playable TV channels). It is what the end checks against the live catalog.
              required:
              - recarga_id
              - esperado
            example:
              recarga_id: 2026-09-05T18-00-00Z
              esperado:
                channels: 93857
                channels_fts: 93857
                streams: 80734
                playable: 9400
      responses:
        '200':
          description: '{ ok, recarga_id, live{channels,channels_fts,channels_fts_ids,streams,blocklist,facet_countries,facet_categories,facet_languages,facet_subdivisions,facet_cities} }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeltaAberto'
        '400':
          description: '`recarga_id` out of format or missing `esperado`.'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '409':
          description: '`delta_recusado`: the answer lists `problemas[]` and the live catalog did not change.'
        '429':
          description: '`orcamento`: insufficient daily budget; keep the pending difference and resume in another round.'
      tags:
      - Admin
  /api/admin/catalogo/delta:
    post:
      operationId: post_api_admin_catalogo_delta
      summary: 'Applies up to 50 rows of ONE table: `upsert` for entries, `alterar` for…'
      description: '`INSERT … ON CONFLICT DO UPDATE` column by column, except the key and the `slug`, which belongs to the product (an indexed URL does not change). `alterar` carries only modified columns, without key/slug or FTS. Equal values are not written again; FTS deletes/reinserts only changed text. Keep the full receipt to follow the progress. The reservation includes indexes, and D1 `rows_written` returns only the measured excess. The order is the client''s: `channels` before `streams` for entries, the reverse for removals (FK).

        Returns: { ok, tabela, recebidas, removidas_pedidas, gravadas, removidas }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recarga_id:
                  type: string
                  description: Identifier of this run (4–64 of `[A-Za-z0-9._-]`); the next requests apply only to the reload that it opened.
                tabela:
                  type: string
                  description: One of `channels`, `channels_fts`, `streams`, `blocklist`, `facet_countries`, `facet_categories`, `facet_languages`, `facet_subdivisions`, `facet_cities`.
                upsert:
                  type: array
                  items:
                    type: object
                  description: Rows with the table columns; a missing column enters with the schema DEFAULT. It can be empty.
                alterar:
                  type: array
                  items:
                    type: object
                  description: '`{ chave, valores: { coluna: valor } }`: only changed columns, with null, a string or a finite number. It does not accept key, slug or FTS.'
                remover:
                  type: array
                  items:
                    type: string
                  description: Keys (`id`, `code` or `channel_id`, according to the table) to delete. It can be empty.
              required:
              - recarga_id
              - tabela
            example:
              recarga_id: 2026-09-05T18-00-00Z
              tabela: facet_countries
              upsert:
              - code: BR
                name: Brazil
              remover:
              - XX
      responses:
        '200':
          description: '{ ok, tabela, recebidas, removidas_pedidas, gravadas, removidas }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeltaAplicado'
        '400':
          description: Unknown table, missing lists or both empty, a row without a key, or an invalid key.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '409':
          description: '`recarga_divergente`: the open run is another one; call `/delta/inicio`.'
        '413':
          description: More than 50 rows (`upsert` + `alterar` + `remover`) or an FTS text field above 4 KiB.
        '429':
          description: '`orcamento`: insufficient daily budget; keep the pending difference and resume in another round.'
      tags:
      - Admin
  /api/admin/catalogo/delta/fim:
    post:
      operationId: post_api_admin_catalogo_delta_fim
      summary: Checks the whole catalog against `esperado` and records the stamp…
      description: 'Count per table equal to `esperado`, one ID in the FTS per channel, no orphan stream, no channel without a slug. Anything else is 409 (`delta_invalido`) without a stamp: the accepted batches stay confirmed and the full reload stays blocked. The record per source (`fontes`) and the `dump_sha256` stay in `catalog_meta`, as in the swap.

        Returns: { ok, recarga_id, depois{channels,channels_fts,channels_fts_ids,streams,blocklist,facet_countries,facet_categories,facet_languages,facet_subdivisions,facet_cities}, synced_at }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recarga_id:
                  type: string
                  description: Identifier of this run (4–64 of `[A-Za-z0-9._-]`); the next requests apply only to the reload that it opened.
                esperado:
                  type: object
                  description: Table → how many rows the WHOLE catalog will have after the difference (`channels_fts` counts distinct IDs), plus `playable` (playable TV channels). It is what the end checks against the live catalog.
                dump_sha256:
                  type: string
                  description: SHA-256 of the dataset that generated this catalog.
                origem:
                  type: string
                  description: 'Who reloaded (e.g.: `operacao`), for the stored report.'
                resumo:
                  type: object
                  description: Counts of the difference (`upsert`, `remover`, `refresh`, `iguais`), only for the report.
              required:
              - recarga_id
              - esperado
            example:
              recarga_id: 2026-09-05T18-00-00Z
              esperado:
                channels: 93857
                channels_fts: 93857
                streams: 80734
                playable: 9400
              dump_sha256: …
              origem: operacao
              resumo:
                upsert: 41200
                remover: 310
                refresh: 7000
                iguais: 190000
      responses:
        '200':
          description: '{ ok, recarga_id, depois{channels,channels_fts,channels_fts_ids,streams,blocklist,facet_countries,facet_categories,facet_languages,facet_subdivisions,facet_cities}, synced_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioDelta'
        '400':
          description: Invalid `recarga_id`, `esperado` or `fontes`.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '409':
          description: '`recarga_divergente` (another run) or `delta_invalido`: the answer lists `problemas[]` and the stamp was not recorded.'
        '429':
          description: '`orcamento`: insufficient daily budget; keep the pending difference and resume in another round.'
      tags:
      - Admin
components:
  schemas:
    SlugPublicado:
      type: object
      properties:
        id:
          type: string
          description: 'Channel ID in the catalog (e.g.: `GloboRJ.br`).'
        slug:
          type: string
          description: Published slug; the swap refuses a staging where this ID comes with another one.
      required:
      - id
      - slug
      description: 'The pair that the reload inherits: stable channel ID → slug already published.'
    ContagemCatalogo:
      type: object
      properties:
        channels:
          type: integer
          description: Channels (rows of `channels`).
        channels_fts:
          type: integer
          description: Rows of the search index (`channels_fts`).
        channels_fts_ids:
          type: integer
          description: Distinct IDs in the search index; the swap requires it to equal `channels`.
        streams:
          type: integer
          description: Streams (rows of `streams`).
        blocklist:
          type: integer
          description: Blocked channels (DMCA), which stay out of the catalog.
        facet_countries:
          type: integer
          description: Countries in the facet.
        facet_categories:
          type: integer
          description: Categories in the facet.
        facet_languages:
          type: integer
          description: Languages in the facet (full ISO 639-3).
        facet_subdivisions:
          type: integer
          description: States and subdivisions in the facet.
        facet_cities:
          type: integer
          description: Cities in the facet.
      required:
      - channels
      - channels_fts
      - channels_fts_ids
      - streams
      - blocklist
      - facet_countries
      - facet_categories
      - facet_languages
      - facet_subdivisions
      - facet_cities
      description: How many rows each catalog table has, live or in staging.
    GuiaLoteGravado:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true`; a refused batch comes back as 4xx.
        day:
          type: string
          description: O dia gravado.
        gravados:
          type: integer
          description: 'Channels that entered (INSERT OR REPLACE: resending does not duplicate).'
      required:
      - ok
      - day
      - gravados
      description: Result of a guide batch.
    DeltaAplicado:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true`; a refused request comes back as 4xx.
        tabela:
          type: string
          description: A tabela tocada.
        recebidas:
          type: integer
          description: Sum of the accepted `upsert` and `alterar` rows.
        removidas_pedidas:
          type: integer
          description: Accepted removal keys, including the ones already missing.
        gravadas:
          type: integer
          description: Rows that went in or were updated (in the FTS, counting the deleted ids).
        removidas:
          type: integer
          description: Linhas apagadas por `remover`.
      required:
      - ok
      - tabela
      - recebidas
      - removidas_pedidas
      - gravadas
      - removidas
      description: A difference request entered the live catalog, in one batch.
    SlugsPublicados:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SlugPublicado'
          description: The pairs of this page.
        next_after:
          type: string
          description: Pass it in `apos` for the next page; `null` when it ended.
          nullable: true
      required:
      - items
      - next_after
      description: Page of published slugs, in ID order.
    LogosMortas:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
          description: '`{ id, name, alt_names, country, logo_url, fail_count, last_error }` por canal.'
        limit:
          type: integer
          description: O teto aplicado.
      required:
      - items
      - limit
      description: Channels with a dead logo origin, for the overrides script to match.
    EstadoCatalogo:
      type: object
      properties:
        live:
          allOf:
          - $ref: '#/components/schemas/ContagemCatalogo'
          description: The catalog that is serving now.
        staging:
          allOf:
          - $ref: '#/components/schemas/ContagemCatalogo'
          description: The `*_novo` tables of the reload in progress; `null` when there is no staging.
          nullable: true
        meta:
          allOf:
          - $ref: '#/components/schemas/MetaCatalogo'
          description: Stamps of the last reload and of the open staging.
      required:
      - live
      - staging
      - meta
      description: The snapshot that the reload service reads before it starts and after it swaps.
    OverridesGravados:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true`; a refused request comes back as 4xx.
        fonte:
          type: string
          description: The source saved in each row.
        gravados:
          type: integer
          description: Overrides that went in (INSERT OR REPLACE).
      required:
      - ok
      - fonte
      - gravados
      description: Result of writing logo overrides.
    MetaCatalogo:
      type: object
      properties:
        synced_at:
          type: string
          description: Instant (ISO-8601) of the last successful swap; it is what `/api/health` compares with the limit of 2 days.
          nullable: true
        applied_at:
          type: string
          description: Instant when the new catalog went live.
          nullable: true
        dump_sha256:
          type: string
          description: SHA-256 of the dataset that generated the live catalog.
          nullable: true
        staging_run:
          type: string
          description: '`recarga_id` of the run with staging open now; `null` without staging.'
          nullable: true
      required:
      - synced_at
      - applied_at
      - dump_sha256
      - staging_run
      description: The reload stamps, read from `catalog_meta`.
    GuiaRegistrada:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true`.
        guia:
          type: object
          description: 'O registro normalizado: `fetched_at`, `itens`, `stale`, `ausente`…'
      required:
      - ok
      - guia
      description: The `guia` source as it was saved in `catalog_meta.fontes`.
    DeltaAberto:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true`; a refusal comes as 409 with `problemas[]`.
        recarga_id:
          type: string
          description: The open run; the next requests repeat it.
        live:
          allOf:
          - $ref: '#/components/schemas/ContagemCatalogo'
          description: The live catalog, before the difference.
      required:
      - ok
      - recarga_id
      - live
      description: The differential reload passed the guard and is marked; nothing changed live yet.
    RelatorioDelta:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true`; a check that fails comes as 409 with `problemas[]`.
        recarga_id:
          type: string
          description: The reload that went live.
        depois:
          allOf:
          - $ref: '#/components/schemas/ContagemCatalogo'
          description: The catalog that is serving now.
        synced_at:
          type: string
          description: The `synced_at` recorded in the same batch as the closing.
      required:
      - ok
      - recarga_id
      - depois
      - synced_at
      description: 'The difference closed: the whole catalog matched `esperado` and the stamp was recorded.'
