openapi: 3.2.0
info:
  title: GradeTV .well Known API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: .well Known
paths:
  /.well-known/{arquivo}:
    get:
      operationId: get_well_known_by_arquivo
      summary: 'Machine discovery before the home page: `api-catalog` (RFC 9727, linkset with…'
      description: 'Returns: `application/linkset+json` for api-catalog; `application/json` for x402, agent-card.json and apis.json; `text/plain` for the other two.'
      security: []
      parameters:
      - name: arquivo
        in: path
        required: true
        schema:
          type: string
        description: '`api-catalog`, `security.txt`, `x402`, `agent-card.json`, `mcp-registry-auth` or `apis.json`.'
        example: api-catalog
      responses:
        '200':
          description: '`application/linkset+json` for api-catalog; `application/json` for x402, agent-card.json and apis.json; `text/plain` for the other two.'
        '404':
          description: Name outside the six published ones.
      tags:
      - .well Known
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
x-provenance:
  method: harvested
  publisher: Grade
  source: https://gradetv.net/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
