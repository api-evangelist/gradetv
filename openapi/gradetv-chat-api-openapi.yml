openapi: 3.2.0
info:
  title: GradeTV Chat API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Chat
paths:
  /api/chat/{channel_id}/mensagens:
    get:
      operationId: chat_history
      summary: Latest messages of the channel room, plus the WebSocket address to follow live
      description: 'Returns: { channel_id, items[{id,autor,body,at}], watching, max_length, _links{self,websocket,channel} }'
      security: []
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
        description: Channel ID in the catalog.
        example: GloboNews.br
      responses:
        '200':
          description: '{ channel_id, items[{id,autor,body,at}], watching, max_length, _links{self,websocket,channel} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_id:
                    type: string
                    description: Channel that the room belongs to.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MensagemChat'
                    description: The latest messages, from the oldest to the newest.
                  watching:
                    type: integer
                    description: How many people have the room open now.
                  max_length:
                    type: integer
                    description: Maximum size of a message.
                  _links:
                    allOf:
                    - $ref: '#/components/schemas/LinksChat'
                    description: This listing, the WebSocket and the channel record.
                required:
                - channel_id
                - items
                - watching
                - max_length
                - _links
        '404':
          description: The channel does not exist in the catalog.
      tags:
      - Chat
    post:
      operationId: chat_send
      summary: Sends a message to the room without opening a WebSocket.
      description: 'Reading is free; writing costs $0.10 per 30 days. Without a valid pass the answer is 402 with `accepts[]`: pay and repeat the same call. The speaker is the guest (`X-Guest-Token`), the same one the WebSocket recognizes; without a guest, the account session.

        Returns: { ok, message{id,autor,body,at} }'
      security:
      - bearerAuth: []
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
        description: Channel ID in the catalog.
        example: GloboNews.br
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: The message text, within `max_length`.
                author:
                  type: string
                  description: Nickname to use; without it the server creates a stable one.
              required:
              - body
            example:
              body: alguém aí?
              author: Wendel
      responses:
        '200':
          description: '{ ok, message{id,autor,body,at} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the message entered.
                  message:
                    allOf:
                    - $ref: '#/components/schemas/MensagemChat'
                    description: The message published in the room.
                required:
                - ok
                - message
        '400':
          description: Text empty or too long.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '402':
          description: 'Payment required. The x402 terms (USDC on Base) come in the `PAYMENT-REQUIRED` header and in `accepts[]`: pay and repeat the same call with `PAYMENT-SIGNATURE` (x402 v2) or `X-PAYMENT` (v1). A standard x402 client such as `@x402/fetch` does this for you.'
        '404':
          description: The channel does not exist.
      tags:
      - Chat
  /api/chat/pass:
    post:
      operationId: chat_pass
      summary: 'Buys or confirms the monthly chat pass: $0.10 per 30 days, through x402 or…'
      description: 'A pass that is already valid returns 200 without charging again: you can call it before writing, with no risk of paying twice. The pass belongs to the person who speaks in the chat: the `X-Guest-Token` guest (the one the WebSocket recognizes in `hello`); without a guest, the account session, which speaks only over HTTP. It stays in the global purchase record (`direito`).

        Returns: { ok, charged, until }'
      x-price-usd: 0.1
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ ok, charged, until }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the pass is valid at the end of the call.
                  charged:
                    type: boolean
                    description: '`true` if this call charged; `false` if the pass was already valid.'
                  until:
                    type: string
                    description: Until when the pass is valid (UTC); `null` with the chat open for free (`X402_GRATIS`).
                    nullable: true
                required:
                - ok
                - charged
                - until
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '402':
          description: 'Payment required. The x402 terms (USDC on Base) come in the `PAYMENT-REQUIRED` header and in `accepts[]`: pay and repeat the same call with `PAYMENT-SIGNATURE` (x402 v2) or `X-PAYMENT` (v1). A standard x402 client such as `@x402/fetch` does this for you.'
        '410':
          description: 'Chave `iptk_…` (retirada): use o convidado.'
        '502':
          description: '`pago_nao_registrado`: paid and not recorded; it brings the `recibo`. Repeat with the same `Idempotency-Key`, without a new charge.'
        '503':
          description: '`pass_unavailable`: no purchase record, nothing charged.'
      tags:
      - Chat
  /api/chat/{channel_id}/ws:
    get:
      operationId: get_api_chat_by_channel_id_ws
      summary: 'WebSocket of the channel room: the live path, with presence'
      description: 'Requires `Upgrade: websocket`; without it, it answers 426. The socket starts MUTED: send `{t:''hello'',token:''ipt_…''}` and then `{t:''msg'',body:''…''}`. You get `{t:''pronto'',autor,items[],watching}` on entry and `{t:''msg''|''presenca'',…}` during the session; an error comes as `{t:''erro'',code:''auth''|''vazio''|''pago''}`.

        Returns: `101 Switching Protocols` and the WebSocket connection; `426` without the upgrade header.'
      security: []
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
        description: Channel ID in the catalog.
        example: GloboNews.br
      responses:
        '200':
          description: '`101 Switching Protocols` and the WebSocket connection; `426` without the upgrade header.'
        '404':
          description: The channel does not exist in the catalog.
      tags:
      - Chat
components:
  schemas:
    MensagemChat:
      type: object
      properties:
        id:
          type: string
          description: Message ID within the room.
        autor:
          type: string
          description: 'Nickname of the sender: stable per owner, created if not given.'
        body:
          type: string
          description: The message text.
        at:
          type: string
          description: When it was sent (UTC).
      required:
      - id
      - autor
      - body
      - at
      description: Message of a channel's chat room.
    LinksChat:
      type: object
      properties:
        self:
          type: string
          description: This same listing over HTTP.
        websocket:
          type: string
          description: '`wss://` URL of the room; send `{t:''hello'',token}` before speaking.'
        channel:
          type: string
          description: Record of the channel that the room belongs to.
      required:
      - self
      - websocket
      - channel
      description: Room addresses, including the WebSocket, which is the live path.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
