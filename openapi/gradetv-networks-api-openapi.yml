openapi: 3.2.0
info:
  title: GradeTV Networks API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Networks
paths:
  /api/networks:
    get:
      operationId: list_networks
      summary: Networks and broadcasters that have a playable channel, with the count
      description: 'Returns: { items[{name,count}] }'
      security: []
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          default: tv
          enum:
          - tv
          - radio
          - all
        description: '`tv` (default) counts TV channels; `radio` counts radio stations; `all` joins both.'
      responses:
        '200':
          description: '{ items[{name,count}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRede'
      tags:
      - Networks
components:
  schemas:
    Rede:
      type: object
      properties:
        name:
          type: string
          description: Network name, e.g. `Globo`.
        count:
          type: integer
          description: Playable channels of this network.
      required:
      - name
      - count
      description: Network/broadcaster with a playable channel.
    ListaRede:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rede'
          description: All the items; these routes do not paginate.
      required:
      - items
      description: 'Small, complete collection: a catalog facet that fits whole in one answer.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
