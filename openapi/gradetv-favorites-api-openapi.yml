openapi: 3.2.0
info:
  title: GradeTV Favorites API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Favorites
paths:
  /api/favorites:
    get:
      operationId: list_favorites
      summary: Channels the owner marked as favorite, from the most recent to the oldest
      description: 'Shows only channels available in the catalog.

        Returns: { items[{channel_id,name,country,quality,logo_url,playable_hint,favorites,created_at,stale,api}], total, limit, offset, next_offset, next, api, max }'
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Items per page. Above 50, it is silently reduced to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: How many items to skip. Use `next_offset` of the previous answer.
      responses:
        '200':
          description: '{ items[{channel_id,name,country,quality,logo_url,playable_hint,favorites,created_at,stale,api}], total, limit, offset, next_offset, next, api, max }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeFavoritos'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - Favorites
    post:
      operationId: add_favorite
      summary: Marks a channel as favorite.
      description: 'Returns: { ok, favorited, created, channel_id, favorites }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_id:
                  type: string
                  description: Canal a favoritar, ex. `GloboNews.br`.
              required:
              - channel_id
            example:
              channel_id: GloboNews.br
      responses:
        '200':
          description: '{ ok, favorited, created, channel_id, favorites }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true`.
                  favorited:
                    type: boolean
                    description: Always `true` at the end of this call.
                  created:
                    type: boolean
                    description: '`true` if it was now; `false` if it was already a favorite.'
                  channel_id:
                    type: string
                    description: O canal favoritado.
                  favorites:
                    type: integer
                    description: Total of people who marked this channel as favorite.
                required:
                - ok
                - favorited
                - created
                - channel_id
                - favorites
        '400':
          description: Missing `channel_id` or the favorites cap was reached.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - Favorites
  /api/favorites/{channel_id}:
    delete:
      operationId: remove_favorite
      summary: Removes the channel from favorites and gives the point back to the public…
      description: 'Returns: { ok, favorited, channel_id, favorites }'
      security:
      - bearerAuth: []
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
        description: Canal a desfavoritar, ex. `GloboNews.br`.
        example: GloboNews.br
      responses:
        '200':
          description: '{ ok, favorited, channel_id, favorites }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true`.
                  favorited:
                    type: boolean
                    description: Always `false` at the end of this call.
                  channel_id:
                    type: string
                    description: The channel that left the favorites.
                  favorites:
                    type: integer
                    description: Total of people who still have this channel as favorite.
                required:
                - ok
                - favorited
                - channel_id
                - favorites
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '404':
          description: The channel was not in your favorites.
      tags:
      - Favorites
components:
  schemas:
    Favorito:
      type: object
      properties:
        channel_id:
          type: string
          description: ID of the favorite channel.
        name:
          type: string
          description: Channel name; it falls back to the ID if it left the catalog.
        country:
          type: string
          description: Country of the channel.
          nullable: true
        quality:
          type: string
          description: Melhor qualidade conhecida.
          nullable: true
        logo_url:
          type: string
          description: Logo served by us.
          nullable: true
        playable_hint:
          type: boolean
          description: Whether the last check found a usable stream.
        favorites:
          type: integer
          description: How many people made this channel a favorite in total.
        created_at:
          type: string
          description: When the owner marked it as favorite (UTC).
        stale:
          type: boolean
          description: '`true` when the channel no longer exists in the catalog.'
        api:
          type: string
          description: Absolute URL of the channel record.
      required:
      - channel_id
      - name
      - country
      - quality
      - logo_url
      - playable_hint
      - favorites
      - created_at
      - stale
      - api
      description: A channel the owner marked as favorite.
    PaginaDeFavoritos:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Favorito'
          description: The items of this page, in the order that the route defines.
        total:
          type: integer
          description: How many items match the filter, ignoring the pagination.
        limit:
          type: integer
          description: Page size actually applied (it can be smaller than the requested one).
        offset:
          type: integer
          description: Offset applied in this page.
        next_offset:
          type: integer
          description: Offset of the next page; `null` when this is the last one.
          nullable: true
        next:
          type: string
          description: 'Absolute URL of the next page, with the same filters: follow it until it comes as `null` to scan everything, without rebuilding the query string.'
          nullable: true
        api:
          type: string
          description: Absolute URL of this listing itself.
        max:
          type: integer
          description: How many favorites the owner can have.
      required:
      - items
      - total
      - limit
      - offset
      - next_offset
      - next
      - api
      - max
      description: Page of the owner's favorites, with the cap of how many fit.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
