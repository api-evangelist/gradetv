openapi: 3.2.0
info:
  title: GradeTV Cities API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Cities
paths:
  /api/cities:
    get:
      operationId: list_cities
      summary: Cities that have a playable channel, filterable by country and by state
      description: 'Returns: { items[{code,country,subdivision,name,count}] }'
      security: []
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: Restricts to one country, ISO 3166-1 alpha-2.
        example: BR
      - name: subdivision
        in: query
        required: false
        schema:
          type: string
        description: Restricts to one state/province.
        example: BR-SP
      - name: kind
        in: query
        required: false
        schema:
          type: string
          default: tv
          enum:
          - tv
          - radio
          - all
        description: '`tv` (default) counts TV channels; `radio` counts radio stations; `all` joins both.'
      responses:
        '200':
          description: '{ items[{code,country,subdivision,name,count}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaCidade'
      tags:
      - Cities
components:
  schemas:
    Cidade:
      type: object
      properties:
        code:
          type: string
          description: Catalog code.
        country:
          type: string
          description: Country, alpha-2.
        subdivision:
          type: string
          description: Subdivision that the city belongs to.
          nullable: true
        name:
          type: string
          description: City name.
        count:
          type: integer
          description: Playable channels in it.
      required:
      - code
      - country
      - subdivision
      - name
      - count
      description: City with a playable channel.
    ListaCidade:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cidade'
          description: All the items; these routes do not paginate.
      required:
      - items
      description: 'Small, complete collection: a catalog facet that fits whole in one answer.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
