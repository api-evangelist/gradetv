openapi: 3.2.0
info:
  title: GradeTV Me API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Me
paths:
  /api/me:
    get:
      operationId: me
      summary: 'The session account: e-mail and the size of its library'
      description: 'The account is the one of the account library; `user.id` is the account ID, and it owns the gallery with a session.

        Returns: { user{id,email}, profile, app, resources{categories,favorites,history} }'
      security:
      - globalAccount: []
      responses:
        '200':
          description: '{ user{id,email}, profile, app, resources{categories,favorites,history} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    allOf:
                    - $ref: '#/components/schemas/Conta'
                    description: The person who owns the session.
                  profile:
                    type: object
                    description: 'Perfil global: `name`, `locale`, `timeZone`, `theme`, `revision`.'
                  app:
                    type: string
                    description: Product name.
                  resources:
                    allOf:
                    - $ref: '#/components/schemas/Recursos'
                    description: How many folders, favorites and channels in the history the account has.
                required:
                - user
                - profile
                - app
                - resources
        '401':
          description: invalid_session
        '503':
          description: auth_unavailable
      tags:
      - Me
components:
  schemas:
    Conta:
      type: object
      properties:
        id:
          type: string
          description: Account ID.
        email:
          type: string
          description: E-mail confirmed by a code.
      required:
      - id
      - email
      description: The person behind the session.
    Recursos:
      type: object
      properties:
        categories:
          type: integer
          description: How many folders the owner has.
        favorites:
          type: integer
          description: How many channels the owner made a favorite.
        history:
          type: integer
          description: How many channels are in the history.
      required:
      - categories
      - favorites
      - history
      description: The size of the owner's library, so that the agent knows what it will find before it searches.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
x-provenance:
  method: harvested
  publisher: Grade
  source: https://gradetv.net/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
