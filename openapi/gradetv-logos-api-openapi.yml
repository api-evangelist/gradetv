openapi: 3.2.0
info:
  title: GradeTV Logos API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Logos
paths:
  /logos/{id}:
    get:
      operationId: get_logos_by_id
      summary: Channel logo served by us, in the card variant (≤256px)
      description: 'It never proxies on the fly: either the file is in the logo mirror (the app files), or it answers 404. This keeps the card page from becoming a third-party image proxy. A channel that left the catalog answers 410, so that an old list that still cites it stops requesting it; an adult content channel answers 404, like one without a variant.

        Returns: `image/webp` or `image/png`: the logo bytes.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Logo ID, which comes in `Canal.logo_url`.
        example: GloboNews.br
      responses:
        '200':
          description: '`image/webp` or `image/png`: the logo bytes.'
        '404':
          description: There is no cached variant for this channel, or the channel has adult content.
        '410':
          description: 'The channel left the catalog: the list that cited it is old.'
      tags:
      - Logos
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
