openapi: 3.2.0
info:
  title: GradeTV Guest API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Guest
paths:
  /api/guest:
    post:
      operationId: create_guest
      summary: 'Creates a guest `ipt_…`: it is the identity that keeps the gallery, history and…'
      description: 'It asks for no e-mail or anything else. Keep the token: if you lose the token, you lose the library, unless the account already claimed it (`POST /api/auth/claim`); then what it kept is in the account.

        Returns: { token }'
      security: []
      responses:
        '200':
          description: '{ token }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The guest, prefix `ipt_`. Send it in `X-Guest-Token` or as Bearer.
                required:
                - token
      tags:
      - Guest
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
x-provenance:
  method: harvested
  publisher: Grade
  source: https://gradetv.net/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
