openapi: 3.2.0
info:
  title: GradeTV Qualities API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Qualities
paths:
  /api/qualities:
    get:
      operationId: list_qualities
      summary: Distinct qualities found in the catalog streams (for radio, codec and bitrate)
      description: 'Returns: { items[{id,name,count}] }'
      security: []
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          default: tv
          enum:
          - tv
          - radio
          - all
        description: '`tv` (default) counts TV channels; `radio` counts radio stations; `all` joins both.'
      responses:
        '200':
          description: '{ items[{id,name,count}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaQualidade'
      tags:
      - Qualities
components:
  schemas:
    ListaQualidade:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Qualidade'
          description: All the items; these routes do not paginate.
      required:
      - items
      description: 'Small, complete collection: a catalog facet that fits whole in one answer.'
    Qualidade:
      type: object
      properties:
        id:
          type: string
          description: The quality itself, e.g. `1080p`.
        name:
          type: string
          description: The same value, for display.
        count:
          type: integer
          description: Streams nesta qualidade.
      required:
      - id
      - name
      - count
      description: Distinct quality found in the streams.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
