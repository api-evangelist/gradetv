openapi: 3.2.0
info:
  title: GradeTV Keys API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Keys
paths:
  /api/keys:
    post:
      operationId: post_api_keys
      summary: 'Retirada: criava chave `iptk_…`. Responde 410'
      description: 'Account and payment are global since 21/09/2026, and the SDK has no API key per account. Identify yourself with `X-Guest-Token: ipt_…` (`POST /api/guest`) or with the account session; a paid call uses the global credit (`Authorization: Bearer cred_…`) or x402.

        Returns: 410 `api_keys_retired`, always.'
      security: []
      responses:
        '200':
          description: 410 `api_keys_retired`, always.
        '410':
          description: 'Always: the own API keys were retired.'
      tags:
      - Keys
    get:
      operationId: get_api_keys
      summary: 'Retirada: listava as chaves `iptk_…`. Responde 410'
      description: 'Account and payment are global since 21/09/2026, and the SDK has no API key per account. Identify yourself with `X-Guest-Token: ipt_…` (`POST /api/guest`) or with the account session; a paid call uses the global credit (`Authorization: Bearer cred_…`) or x402.

        Returns: 410 `api_keys_retired`, always.'
      security: []
      responses:
        '200':
          description: 410 `api_keys_retired`, always.
        '410':
          description: 'Always: the own API keys were retired.'
      tags:
      - Keys
  /api/keys/{id}:
    delete:
      operationId: delete_api_keys_by_id
      summary: 'Retired: it revoked an `iptk_…` key. It answers 410'
      description: 'Account and payment are global since 21/09/2026, and the SDK has no API key per account. Identify yourself with `X-Guest-Token: ipt_…` (`POST /api/guest`) or with the account session; a paid call uses the global credit (`Authorization: Bearer cred_…`) or x402.

        Returns: 410 `api_keys_retired`, always.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of an old key; ignored.
        example: key_9f3c2b1d7a
      responses:
        '200':
          description: 410 `api_keys_retired`, always.
        '404':
          description: 'Path outside the retired family: every `/api/keys/…` answers 410.'
        '410':
          description: 'Always: the own API keys were retired.'
      tags:
      - Keys
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
