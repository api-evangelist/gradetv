openapi: 3.2.0
info:
  title: GradeTV Vitrine API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Vitrine
paths:
  /api/vitrine:
    get:
      operationId: get_api_vitrine
      summary: 'The public numbers of the product: traffic, agents, usage and reliability…'
      description: 'Projection published every hour by the house collector, rounded to two significant digits; `null` is a missing measurement, never zero. Cache of 15 minutes with ETag (`If-None-Match` → 304). There is no way to send numbers through this route: the collector publishes, with its own token.

        Returns: { v, produto, publicado, atualizado_em, stale, nome?, desde?, fuso?, hoje?, dias?, janelas?, visitantes?, pessoas?, agentes?, superficies?, mcp?, uso?, contas?, confiabilidade?, catalogo?, apoio? }'
      security: []
      responses:
        '200':
          description: '{ v, produto, publicado, atualizado_em, stale, nome?, desde?, fuso?, hoje?, dias?, janelas?, visitantes?, pessoas?, agentes?, superficies?, mcp?, uso?, contas?, confiabilidade?, catalogo?, apoio? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  v:
                    type: integer
                    description: Contract version (1).
                  produto:
                    type: string
                    description: Product ID.
                  publicado:
                    type: boolean
                    description: '`false` before the first publication of the collector; then only these five keys come.'
                  atualizado_em:
                    type: string
                    description: When the collector published (ISO 8601).
                    nullable: true
                  stale:
                    type: boolean
                    description: '`true` when the projection is more than 26 h old.'
                  nome:
                    type: string
                    description: Product name.
                  desde:
                    type: string
                    description: Day from which the series is valid.
                    nullable: true
                  fuso:
                    type: string
                    description: Time zone of the days (`UTC`).
                  hoje:
                    type: object
                    description: 'Today: pages per class (person, AI, bot), API calls per class, reads of the machine surfaces and product usage.'
                  dias:
                    type: array
                    items:
                      type: object
                    description: 'Up to 31 days, the oldest first: `dia`, `paginas`, `api`, `api_ia`, `maquina`, `visitantes`, `uso`.'
                  janelas:
                    type: object
                    description: Sums of 7 and 30 days (`d7`, `d30`).
                  visitantes:
                    type: object
                    description: Unique visitors at the edge in 7 days.
                  pessoas:
                    type: object
                    description: 'GA4 when available: users, sessions, countries, devices and who arrived from AI.'
                    nullable: true
                  agentes:
                    type: object
                    description: The AI agents and bots that read the most, 7 days.
                  superficies:
                    type: object
                    description: Reads of OKF, llms, well-known, OpenAPI and MCP in 7 days.
                  mcp:
                    type: object
                    description: MCP calls in 7 days.
                  uso:
                    type: object
                    description: 'Actual product usage per resource: label, today, 7 and 30 days.'
                  contas:
                    type: object
                    description: Users and guests.
                    nullable: true
                  confiabilidade:
                    type: object
                    description: Percentage of requests without 5xx in 7 days, and the live build.
                  catalogo:
                    type: object
                    description: Size of the collection, when the product has one.
                    nullable: true
                  apoio:
                    type: object
                    description: Impressions and clicks per sponsor, when available.
                required:
                - v
                - produto
                - publicado
                - atualizado_em
                - stale
      tags:
      - Vitrine
  /api/vitrine/operador:
    get:
      operationId: get_api_vitrine_operador
      summary: The full document of the product in the operator dashboard, only with the…
      description: 'Returns: { produto, atualizado_em, operador }'
      security: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: '`Bearer <METRICS_TOKEN>` — a classe operador.'
      responses:
        '200':
          description: '{ produto, atualizado_em, operador }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  produto:
                    type: string
                    description: Product ID.
                  atualizado_em:
                    type: string
                    description: When the collector published.
                    nullable: true
                  operador:
                    type: object
                    description: The full document of the collector, with what the public projection does not carry.
                    nullable: true
                required:
                - produto
                - atualizado_em
                - operador
        '401':
          description: No token, wrong token or a token of another class.
        '503':
          description: Worker without `METRICS_TOKEN` or without the control plane.
      tags:
      - Vitrine
  /api/vitrine/painel:
    get:
      operationId: get_api_vitrine_painel
      summary: The dashboard of the whole house, in the shape that gm reads, only with the…
      description: 'Returns: { apps, updated?, totals? }'
      security: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: '`Bearer <METRICS_TOKEN>` — a classe operador.'
      responses:
        '200':
          description: '{ apps, updated?, totals? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      type: object
                    description: One operator document per product, in ID order.
                  updated:
                    type: string
                    description: When the collector closed the round.
                  totals:
                    type: object
                    description: The house totals.
                required:
                - apps
        '401':
          description: No token, wrong token or a token of another class.
        '503':
          description: Worker without `METRICS_TOKEN` or without the control plane.
      tags:
      - Vitrine
  /api/vitrine/cursores:
    get:
      operationId: get_api_vitrine_cursores
      summary: The resolved-error cursor per product (`borda`, `cli`), only with the operator…
      description: 'Returns: JSON: `{ [produto]: { borda?: ISO, cli?: ISO } }`; empty is `{}`.'
      security: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: '`Bearer <METRICS_TOKEN>` — a classe operador.'
      responses:
        '200':
          description: 'JSON: `{ [produto]: { borda?: ISO, cli?: ISO } }`; empty is `{}`.'
        '401':
          description: No token, wrong token or a token of another class.
        '503':
          description: Worker without `METRICS_TOKEN` or without the control plane.
      tags:
      - Vitrine
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
