openapi: 3.2.0
info:
  title: GradeTV Tags API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Tags
paths:
  /api/tags:
    get:
      operationId: list_tags
      summary: Tags of the playable radio stations (free vocabulary), with the count of each…
      description: 'Returns: { items[{id,name,count}] }'
      security: []
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: Restricts to the stations of one country, ISO 3166-1 alpha-2.
        example: BR
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 40
        description: How many tags to return (limit 100).
      responses:
        '200':
          description: '{ items[{id,name,count}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaTag'
      tags:
      - Tags
components:
  schemas:
    Tag:
      type: object
      properties:
        id:
          type: string
          description: The tag as it is in the source, in lowercase (e.g. `mpb`).
        name:
          type: string
          description: The same text, for display.
        count:
          type: integer
          description: Playable stations with this tag in the requested segment.
      required:
      - id
      - name
      - count
      description: Radio station tag, free catalog vocabulary, with the count in the segment.
    ListaTag:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: All the items; these routes do not paginate.
      required:
      - items
      description: 'Small, complete collection: a catalog facet that fits whole in one answer.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
