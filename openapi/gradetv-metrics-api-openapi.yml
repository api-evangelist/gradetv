openapi: 3.2.0
info:
  title: GradeTV Metrics API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Metrics
paths:
  /api/metrics:
    get:
      operationId: get_api_metrics
      summary: Metrics of the last 7 days. With the operator token, they include the payments
      description: 'Without a credential it returns visits and usage (`accounts` comes empty: guest and account belong to the SDK, without a count per product). With `METRICS_TOKEN` as Bearer it adds `payments`, and only on Base mainnet, because staging numbers in a financial dashboard mislead.

        Returns: { app, today, today_visits, today_contacts?, today_plays, today_feeds, days, usage, accounts, top_plays, financeiro?, payments? }'
      security: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: '`Bearer <METRICS_TOKEN>` to include the financial block.'
      responses:
        '200':
          description: '{ app, today, today_visits, today_contacts?, today_plays, today_feeds, days, usage, accounts, top_plays, financeiro?, payments? }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metricas'
      tags:
      - Metrics
components:
  schemas:
    Metricas:
      type: object
      properties:
        app:
          type: string
          description: Product name.
        today:
          type: string
          description: Reference day (UTC, YYYY-MM-DD).
        today_visits:
          type: integer
          description: Visits counted today.
        today_contacts:
          type: integer
          description: Today's contacts; only with `METRICS_TOKEN`.
        today_plays:
          type: integer
          description: Plays counted today.
        today_feeds:
          type: integer
          description: Feeds served today.
        days:
          type: array
          items:
            type: object
          description: One record per day of the window, with the counts of each metric.
        usage:
          type: object
          description: 'Usage per product resource: here, items in the gallery.'
        accounts:
          type: object
          description: 'Empty: guest and account belong to the SDK, with no table or count per product here.'
        top_plays:
          type: array
          items:
            type: object
          description: 'Most played channels today: `channel_id`, `name` and `count`.'
        financeiro:
          type: object
          description: '`hoje_usd`, `hoje_count`, `rede`; only with `METRICS_TOKEN`.'
        payments:
          type: object
          description: Financial summary; only with METRICS_TOKEN.
      required:
      - app
      - today
      - today_visits
      - today_plays
      - today_feeds
      - days
      - usage
      - accounts
      - top_plays
      description: 7-day dashboard. The `payments` block appears only with the operator token and only on Base mainnet.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
x-provenance:
  method: harvested
  publisher: Grade
  source: https://gradetv.net/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
