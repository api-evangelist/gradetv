          description: Votes recorded for the station.
        clicks:
          type: integer
          description: Clicks recorded for the station.
        codec:
          type: string
          description: Stream codec (`MP3`, `AAC+`…), when the source knows it.
          nullable: true
        bitrate:
          type: integer
          description: Bitrate in kbps, when the source knows it.
          nullable: true
        geo:
          type: object
          description: '`{ lat, lon }` of the station, when the source has it; otherwise `null`.'
          nullable: true
      required:
      - tags
      - votes
      - clicks
      - codec
      - bitrate
      - geo
      description: Information specific to a radio station. It comes in `Canal.radio` when `kind` is `radio`.
    SaudeCanal:
      type: object
      properties:
        channel_id:
          type: string
          description: Channel that this health refers to.
        plays:
          type: integer
          description: Success reports, worldwide.
        fails:
          type: integer
          description: Failure reports, worldwide.
        favorites:
          type: integer
          description: How many people made the channel a favorite.
        comments:
          type: integer
          description: Public comments on the channel.
        health:
          type: integer
          description: Success percentage; `null` with fewer than `min_relatos`.
          nullable: true
        last_ok_at:
          type: string
          description: Last success report (UTC).
          nullable: true
        last_fail_at:
          type: string
          description: Last failure report (UTC).
          nullable: true
        last_fail_code:
          type: string
          description: Code of the most recent failure.
          nullable: true
        min_relatos:
          type: integer
          description: How many reports are necessary before calculating `health`.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/MotivoFalha'
          description: Reported failure codes, from the most frequent to the least frequent.
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Ambiente'
          description: The same channel per browser, system and country.
        your_environment:
          allOf:
          - $ref: '#/components/schemas/Ambiente'
          description: Reports in the requester's browser, system and country.
        regions:
          type: array
          items:
            $ref: '#/components/schemas/RegiaoSaude'
          description: Playback reports grouped by country.
        geo:
          allOf:
          - $ref: '#/components/schemas/GeoCanal'
          description: Pattern of the failures per country. The comparison does not confirm a regional block or a transmission outage.
        latency:
          type: array
          items:
            $ref: '#/components/schemas/LatenciaPais'
          description: Average time for the Grade to fetch the broadcast data at `/api/s/:id`, per country.
        your_country:
          allOf:
          - $ref: '#/components/schemas/RegiaoSaude'
          description: Reports and average response time in the requester's country.
        pra_voce:
          allOf:
          - $ref: '#/components/schemas/SinalPraVoce'
          description: Summary of the reports and of the response time in the requester's country.
        codes:
          type: array
          items:
            type: string
          description: All the failure codes that the product recognizes.
        _links:
          allOf:
          - $ref: '#/components/schemas/LinksSaude'
          description: This health, the channel and where to report.
      required:
      - channel_id
      - plays
      - fails
      - favorites
      - comments
      - health
      - last_ok_at
      - last_fail_at
      - last_fail_code
      - min_relatos
      - reasons
      - environments
      - your_environment
      - regions
      - geo
      - latency
      - your_country
      - pra_voce
      - codes
      - _links
      description: Playback results reported per browser, system and country. The reports do not confirm the cause of the failure.
