openapi: 3.2.0
info:
  title: GradeTV Channels API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Channels
paths:
  /api/channels:
    get:
      operationId: search_channels
      summary: Paginated search of the public catalog, with the category facets of the current…
      description: 'It is the entry point of the product. The answer varies by the requester''s browser, system and country: each channel brings `social.your_fails`, the extract of YOUR environment; for this reason it is `Cache-Control: private`.

        Returns: { items[{id,name,alt_names,country,categories,category_labels,languages,language_labels,logo_url,website,playable_hint?,slug,network,owners,launched,replaced_by,feed_name,feed_format,timezones,broadcast_area,quality?,has_guide,guide_site,guide_lang,subdivision,city,kind,radio?,origem,guide_now?,health_ext,social?,api}], total, limit, offset, next_offset, facets{categories}, filters{q,country,category,language,network,quality,guide,subdivision,city,playable,sort,online,kind,tag} }'
      security: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Free text in the channel name and aliases (full-text search).
        example: globo
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: Country of the channel, ISO 3166-1 alpha-2.
        example: BR
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Catalog category ID.
        example: news
      - name: language
        in: query
        required: false
        schema:
          type: string
        description: Language of the channel, ISO 639-3.
        example: por
      - name: network
        in: query
        required: false
        schema:
          type: string
        description: Exact name of the network/broadcaster.
        example: Globo
      - name: quality
        in: query
        required: false
        schema:
          type: string
        description: Exact quality of the stream.
        example: 1080p
      - name: guide
        in: query
        required: false
        schema:
          type: boolean
          default: '0'
          enum:
          - '0'
          - '1'
        description: '`1` brings only channels with a program schedule (EPG).'
      - name: subdivision
        in: query
        required: false
        schema:
          type: string
        description: State/province, catalog code.
        example: BR-SP
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: City, catalog code.
      - name: playable
        in: query
        required: false
        schema:
          type: boolean
          default: '1'
          enum:
          - '0'
          - '1'
        description: '`0` includes channels without a known usable stream.'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: name
          enum:
          - name
          - score
          - votes
        description: '`score` sorts by the health measured by a third party, best first; an unmeasured channel goes to the end. `votes` sorts by the votes recorded for the station (radio). `name` is the alphabetical order.'
      - name: online
        in: query
        required: false
        schema:
          type: boolean
          default: '0'
          enum:
          - '0'
          - '1'
        description: '`1` brings only channels that the source saw online in the 48 h before the last catalog reload (`health_ext.online`); with the catalog stopped for more than 48 h, the filter returns none.'
      - name: kind
        in: query
        required: false
        schema:
          type: string
          default: tv
          enum:
          - tv
          - radio
          - all
        description: '`tv` (default) is the TV catalog; `radio` is the radio stations; `all` joins both. Without `kind`, radio never appears.'
      - name: tag
        in: query
        required: false
        schema:
          type: string
        description: Radio station tag (free vocabulary, e.g. `mpb`, `news`); see `GET /api/tags`.
        example: mpb
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Items per page. Above 50, it is silently reduced to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: How many items to skip. Use `next_offset` of the previous answer.
      responses:
        '200':
          description: '{ items[{id,name,alt_names,country,categories,category_labels,languages,language_labels,logo_url,website,playable_hint?,slug,network,owners,launched,replaced_by,feed_name,feed_format,timezones,broadcast_area,quality?,has_guide,guide_site,guide_lang,subdivision,city,kind,radio?,origem,guide_now?,health_ext,social?,api}], total, limit, offset, next_offset, facets{categories}, filters{q,country,category,language,network,quality,guide,subdivision,city,playable,sort,online,kind,tag} }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeCanais'
      tags:
      - Channels
  /api/channels/{id}:
    get:
      operationId: get_channel
      summary: Full record of a channel, with the streams already pointing to our hop
      description: 'Returns: { id, name, alt_names, country, categories, category_labels, languages, language_labels, logo_url, website, playable_hint?, slug, network, owners, launched, replaced_by, feed_name, feed_format, timezones, broadcast_area, quality?, has_guide, guide_site, guide_lang, subdivision, city, kind, radio?{tags,votes,clicks,codec,bitrate,geo}, origem, guide_now?{day,site,agora,a_seguir}, health_ext{score,online,checked_at}, social?{plays,fails,favorites,comments,last_fail_code,health,your_plays,your_fails,your_fail_code,your_country_ok,your_country_fail,your_geo_ok,your_latency_ms,your_latency_grade}, api, streams[{id,provider_url,legacy_url,feed,title,url,quality,needs_headers,label,scheme,kind,youtube?,playable_hint,origem,health_ext}], _links{self,app,api_index} }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Channel ID in the catalog, e.g. `GloboNews.br`.
        example: GloboNews.br
      responses:
        '200':
          description: '{ id, name, alt_names, country, categories, category_labels, languages, language_labels, logo_url, website, playable_hint?, slug, network, owners, launched, replaced_by, feed_name, feed_format, timezones, broadcast_area, quality?, has_guide, guide_site, guide_lang, subdivision, city, kind, radio?{tags,votes,clicks,codec,bitrate,geo}, origem, guide_now?{day,site,agora,a_seguir}, health_ext{score,online,checked_at}, social?{plays,fails,favorites,comments,last_fail_code,health,your_plays,your_fails,your_fail_code,your_country_ok,your_country_fail,your_geo_ok,your_latency_ms,your_latency_grade}, api, streams[{id,provider_url,legacy_url,feed,title,url,quality,needs_headers,label,scheme,kind,youtube?,playable_hint,origem,health_ext}], _links{self,app,api_index} }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanalCompleto'
        '404':
          description: Channel not available in the catalog.
      tags:
      - Channels
  /api/channels/{id}/health:
    get:
      operationId: channel_health
      summary: 'Why the channel fails, for whom and where: it includes geo-blocking, latency…'
      description: 'It is what separates ''the channel is down'' from ''the channel is blocked in your country''. `geo` tells whether it is a regional restriction or a general failure (with the countries), `regions[]` brings success/failure per country, `latency[]` the opening speed measured at the hop per country, and `pra_voce` summarizes everything for the caller''s country. Without community reports (`POST /api/play-report`) the dashboard stays empty.

        Returns: { channel_id, plays, fails, favorites, comments, health, last_ok_at, last_fail_at, last_fail_code, min_relatos, reasons[{code,label,hint,count,last_at}], environments[{browser,os,country,label,plays,fails,health,last_fail_code,last_at}], your_environment{browser,os,country,label,plays,fails,health,last_fail_code,last_at}, regions[{country,plays,fails,health,latency_ms,latency_grade}], geo{tipo,bloqueado_em,funciona_em,label}, latency[{country,samples,avg_ms,grade,grade_label,last_at}], your_country{country,plays,fails,health,latency_ms,latency_grade}, pra_voce{nivel}, codes, _links{self,channel,report} }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Channel ID in the catalog.
        example: GloboNews.br
      responses:
        '200':
          description: '{ channel_id, plays, fails, favorites, comments, health, last_ok_at, last_fail_at, last_fail_code, min_relatos, reasons[{code,label,hint,count,last_at}], environments[{browser,os,country,label,plays,fails,health,last_fail_code,last_at}], your_environment{browser,os,country,label,plays,fails,health,last_fail_code,last_at}, regions[{country,plays,fails,health,latency_ms,latency_grade}], geo{tipo,bloqueado_em,funciona_em,label}, latency[{country,samples,avg_ms,grade,grade_label,last_at}], your_country{country,plays,fails,health,latency_ms,latency_grade}, pra_voce{nivel}, codes, _links{self,channel,report} }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaudeCanal'
        '404':
          description: The channel does not exist in the catalog.
      tags:
      - Channels
  /api/channels/{id}/guia:
    get:
      operationId: get_channel_guide
      summary: 'Today''s schedule of the channel, grabbed by us: what is on air now and what…'
      description: 'Available on channels with a guide (`guide=1`), valid for up to two days. Check the date of the answer; the record brings the summary in `guide_now`.

        Returns: { channel_id, day, site, agora{inicio,fim,titulo,desc?,categoria?}, a_seguir{inicio,fim,titulo,desc?,categoria?}, programas[{inicio,fim,titulo,desc?,categoria?}] }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Channel ID in the catalog.
        example: RecordNews.br
      responses:
        '200':
          description: '{ channel_id, day, site, agora{inicio,fim,titulo,desc?,categoria?}, a_seguir{inicio,fim,titulo,desc?,categoria?}, programas[{inicio,fim,titulo,desc?,categoria?}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaDoDia'
        '404':
          description: Channel without today's guide (or with an old guide).
      tags:
      - Channels
  /api/channels/{id}/comments:
    get:
      operationId: list_comments
      summary: Public comments of a channel, from the newest to the oldest
      description: 'With a credential in the call, each of your comments comes with `mine: true`; this is how the interface knows what can be deleted.

        Returns: { items[{id,channel_id,author,body,created_at,mine,api}], total, limit, offset, next_offset, next, api, channel_id, max_length }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Channel ID in the catalog.
        example: GloboNews.br
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Items per page. Above 50, it is silently reduced to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: How many items to skip. Use `next_offset` of the previous answer.
      responses:
        '200':
          description: '{ items[{id,channel_id,author,body,created_at,mine,api}], total, limit, offset, next_offset, next, api, channel_id, max_length }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeComentarios'
        '404':
          description: The channel does not exist in the catalog.
      tags:
      - Channels
    post:
      operationId: post_comment
      summary: Writes a comment on the channel. Cap of 20 per hour per owner
      description: 'Without `author`, the nickname is generated and stays stable for the same owner: the person does not get a different name in each message.

        Returns: { ok, comment{id,channel_id,author,body,created_at,mine,api} }'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Channel ID in the catalog.
        example: GloboNews.br
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: The comment text; the cap comes in `max_length` of the listing.
                author:
                  type: string
                  description: Nickname to use; without it the server creates a stable one.
              required:
              - body
            example:
              body: Só abre no formato 720p.
              author: Wendel
      responses:
        '200':
          description: '{ ok, comment{id,channel_id,author,body,created_at,mine,api} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the comment entered.
                  comment:
                    allOf:
                    - $ref: '#/components/schemas/Comentario'
                    description: The created comment, as it appears in the listing.
                required:
                - ok
                - comment
        '400':
          description: Empty text or above `max_length`.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '404':
          description: The channel does not exist.
        '429':
          description: Over 20 comments in the hour.
      tags:
      - Channels
components:
  schemas:
    FacetasCanal:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/FacetaCategoria'
          description: Categories present in the result, with the count of each one.
      required:
      - categories
      description: Segments of the current search. Today only category; the format accepts more without breaking clients.
    Youtube:
      type: object
      properties:
        video:
          type: string
          description: Video ID of the live stream (11 characters), when the source gave a video.
        channel:
          type: string
          description: 'Channel ID (`UC…`), when the source gave the channel: the embed opens the current live stream.'
        embed:
          type: string
          description: URL of the official cookie-free embed (`youtube-nocookie.com`).
        assistir:
          type: string
          description: URL to open in YouTube (player button and hop destination).
      required:
      - embed
      - assistir
      description: 'A stream that is a YouTube live stream: the player embeds the official one; M3U/XSPF do not carry it.'
    Stream:
      type: object
      properties:
        id:
          type: string
          description: Stream ID; it is the `:id` of `GET /api/s/:id`.
        provider_url:
          type: string
          description: Direct broadcast URL at the provider, to copy and paste in another player after an access failure; null for a non-HTTP(S) protocol. The official site is in Canal.website.
          nullable: true
        legacy_url:
          type: string
          description: Standalone legacy HTTP player for HTTP media. Null for an incompatible origin; it does not waive CORS or access to the origin.
          nullable: true
        feed:
          type: string
          description: Which feed of the channel this stream serves.
          nullable: true
        title:
          type: string
          description: Stream title, when the source declares it.
          nullable: true
        url:
          type: string
          description: 'Playback URL at our hop: it counts the play (once per person, channel and day) and returns the playlist.'
        quality:
          type: string
          description: Qualidade declarada deste stream.
          nullable: true
        needs_headers:
          type: boolean
          description: Whether the origin requires Referer/User-Agent; the hop takes care of it.
        label:
          type: string
          description: Short label to choose between streams.
          nullable: true
        scheme:
          type: string
          description: 'Scheme of the origin URL: `http`, `https`, or `youtube` (a YouTube broadcast, playable only by the site player, never by the M3U).'
        kind:
          type: string
          description: 'How to play: `hls`, `dash`, `ts`, `flv`, `audio` (continuous radio), `youtube` (official embedded player) or `externo` (RTMP/RTSP).'
        youtube:
          allOf:
          - $ref: '#/components/schemas/Youtube'
          description: 'Only for a YouTube stream: IDs and the embed and watch URLs.'
        playable_hint:
          type: boolean
          description: Whether the last check found this stream usable.
        origem:
          type: string
          description: Provenance identifier; credits and licenses at `/sobre`.
        health_ext:
          allOf:
          - $ref: '#/components/schemas/SaudeMedidaStream'
          description: The most recent check of this stream; `null` when it was not measured.
          nullable: true
      required:
      - id
      - provider_url
      - legacy_url
      - feed
      - title
      - url
      - quality
      - needs_headers
      - label
      - scheme
      - kind
      - playable_hint
      - origem
      - health_ext
      description: One of the broadcasts of a channel. The `url` is already our hop, not the origin.
    FiltrosCanal:
      type: object
      properties:
        q:
          type: string
          description: Busca textual aplicada.
          nullable: true
        country:
          type: string
          description: Applied country, already in uppercase.
          nullable: true
        category:
          type: string
          description: Categoria aplicada.
          nullable: true
        language:
          type: string
          description: Applied language, already normalized to ISO 639-3.
          nullable: true
        network:
          type: string
          description: Rede aplicada.
          nullable: true
        quality:
          type: string
          description: Qualidade aplicada.
          nullable: true
        guide:
          type: boolean
          description: Whether the program schedule filter was on.
        subdivision:
          type: string
          description: Applied subdivision.
          nullable: true
        city:
          type: string
          description: Cidade aplicada.
          nullable: true
        playable:
          type: boolean
          description: Whether only channels with a usable stream entered.
        sort:
          type: string
          description: 'Applied order: `name`, `score` (health measured by a third party) or `votes` (radio).'
        online:
          type: boolean
          description: Whether only channels that the source saw online in the 48 h before the last reload entered.
        kind:
          type: string
          description: '`tv`, `radio` or `all`: without `kind` in the call, it is `tv`.'
        tag:
          type: string
          description: Applied radio tag.
          nullable: true
      required:
      - q
      - country
      - category
      - language
      - network
      - quality
      - guide
      - subdivision
      - city
      - playable
      - sort
      - online
      - kind
      - tag
      description: 'What the server understood from what you sent: useful to know why a filter did not apply.'
    Comentario:
      type: object
      properties:
        id:
          type: string
          description: Comment ID, to delete it.
        channel_id:
          type: string
          description: Channel where the comment was written.
        author:
          type: string
          description: Nickname of the author; `Visitante` when not given.
        body:
          type: string
          description: The comment text.
        created_at:
          type: string
          description: When it was written (UTC, with milliseconds).
        mine:
          type: boolean
          description: '`true` if it is yours: only you can delete it.'
        api:
          type: string
          description: Absolute URL of this comment.
      required:
      - id
      - channel_id
      - author
      - body
      - created_at
      - mine
      - api
      description: Public comment on a channel.
    Ambiente:
      type: object
      properties:
        browser:
          type: string
          description: Normalized browser, e.g. `Chrome`; `Outro` when it cannot be told.
        os:
          type: string
          description: Sistema normalizado, ex. `Android`.
        country:
          type: string
          description: Country of the reporter, alpha-2.
        label:
          type: string
          description: The three above in one sentence, for display.
        plays:
          type: integer
          description: Success reports in this environment.
        fails:
          type: integer
          description: Failure reports in this environment.
        health:
          type: integer
          description: Success percentage here; `null` without enough reports.
          nullable: true
        last_fail_code:
          type: string
          description: Code of the last failure in this environment.
          nullable: true
        last_at:
          type: string
          description: Most recent report in this environment (UTC).
          nullable: true
      required:
      - browser
      - os
      - country
      - label
      - plays
      - fails
      - health
      - last_fail_code
      - last_at
      description: The behavior of the channel in a specific browser, system and country.
    PaginaDeCanais:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Canal'
          description: 'The channels of this page, in the requested order (`sort`): name, or the best measured health first.'
        total:
          type: integer
          description: Channels that match the filter, ignoring the pagination.
        limit:
          type: integer
          description: Applied page size (cap of 50).
        offset:
          type: integer
          description: Offset applied in this page.
        next_offset:
          type: integer
          description: Offset of the next page; `null` when it ended.
          nullable: true
        facets:
          allOf:
          - $ref: '#/components/schemas/FacetasCanal'
          description: Count per category WITHIN the current filter; use it to build the side menu.
        filters:
          allOf:
          - $ref: '#/components/schemas/FiltrosCanal'
          description: The filters as the server understood them, already normalized.
      required:
      - items
      - total
      - limit
      - offset
      - next_offset
      - facets
      - filters
      description: The answer of the channel search. It does not use the `Pagina<T>` envelope because it swaps `api` for `facets` and `filters`.
    GuiaDoDia:
      type: object
      properties:
        channel_id:
          type: string
          description: Channel ID in the catalog.
        day:
          type: string
          description: Dia grabado, YYYY-MM-DD.
        site:
          type: string
          description: 'Legacy field: always null.'
          nullable: true
        agora:
          allOf:
          - $ref: '#/components/schemas/Programa'
          description: O programa no ar neste instante.
          nullable: true
        a_seguir:
          allOf:
          - $ref: '#/components/schemas/Programa'
          description: The next program.
          nullable: true
        programas:
          type: array
          items:
            $ref: '#/components/schemas/Programa'
          description: All the programs of the day, in order (up to 512).
      required:
      - channel_id
      - day
      - site
      - agora
      - a_seguir
      - programas
      description: The schedule available for the day of a channel.
    CanalCompleto:
      type: object
      properties:
        id:
          type: string
          description: Stable catalog ID, e.g. `GloboNews.br`. It is the key in the whole API.
        name:
          type: string
          description: Display name of the channel.
        alt_names:
          type: array
          items:
            type: string
          description: Other names by which the channel is known.
        country:
          type: string
          description: Country of origin, ISO 3166-1 alpha-2.
          nullable: true
        categories:
          type: array
          items:
            type: string
          description: Catalog category IDs, e.g. `news`, `sports`.
        category_labels:
          type: array
          items:
            type: string
          description: The same IDs already translated for display.
        languages:
          type: array
          items:
            type: string
          description: Languages of the channel, ISO 639-3.
        language_labels:
          type: array
          items:
            type: string
          description: Names of the languages above, when known.
        logo_url:
          type: string
          description: Logo served by us (≤256px variant), not the origin.
          nullable: true
        website:
          type: string
          description: Official site of the channel.
          nullable: true
        playable_hint:
          type: boolean
          description: Whether the last check found a usable stream.
        slug:
          type: string
          description: Readable identifier; it is an API ID, not a public URL.
          nullable: true
        network:
          type: string
          description: Network or broadcaster that the channel belongs to.
          nullable: true
        owners:
          type: array
          items:
            type: string
          description: Who operates the channel, according to the register.
        launched:
          type: string
          description: Release date (YYYY-MM-DD).
          nullable: true
        replaced_by:
          type: string
          description: ID of the channel that replaced this one, if it was discontinued.
          nullable: true
        feed_name:
          type: string
          description: Feed name when the channel has more than one.
          nullable: true
        feed_format:
          type: string
          description: Feed format that the source declares.
          nullable: true
        timezones:
          type: array
          items:
            type: string
          description: Time zones where the channel broadcasts.
        broadcast_area:
          type: array
          items:
            type: string
          description: Coverage area, in catalog codes.
        quality:
          type: string
          description: Melhor qualidade conhecida, ex. `1080p`.
        has_guide:
          type: boolean
          description: Whether there is a program schedule (EPG) for this channel.
        guide_site:
          type: string
          description: 'Legacy field: always null; providers stay internal.'
          nullable: true
        guide_lang:
          type: string
          description: Language of the schedule.
          nullable: true
        subdivision:
          type: string
          description: State/province, catalog code.
          nullable: true
        city:
          type: string
          description: City, catalog code.
          nullable: true
        kind:
          type: string
          description: '`tv` or `radio` (radio station).'
        radio:
          allOf:
          - $ref: '#/components/schemas/Radio'
          description: 'Only for a radio station: tags, votes, clicks, codec, bitrate and location.'
        origem:
          type: string
          description: Provenance identifier; credits and licenses at `/sobre`.
        guide_now:
          allOf:
          - $ref: '#/components/schemas/GuiaAgora'
          description: 'Only in the record: now and next in today''s schedule, grabbed by us; `null` without a fresh guide.'
          nullable: true
        health_ext:
          allOf:
          - $ref: '#/components/schemas/SaudeMedida'
          description: Health measured by a third party; `null` when the channel was not measured.
          nullable: true
        social:
          allOf:
          - $ref: '#/components/schemas/Social'
          description: Community counters; missing in the SEO HTML pages.
        api:
          type: string
          description: Absolute URL of the record of this channel.
        streams:
          type: array
          items:
            $ref: '#/components/schemas/Stream'
          description: Known broadcasts, with the URL already pointing to our hop.
        _links:
          allOf:
          - $ref: '#/components/schemas/LinksCanal'
          description: This record, the same thing in the human interface, and the API index.
      required:
      - id
      - name
      - alt_names
      - country
      - categories
      - category_labels
      - languages
      - language_labels
      - logo_url
      - website
      - slug
      - network
      - owners
      - launched
      - replaced_by
      - feed_name
      - feed_format
      - timezones
      - broadcast_area
      - has_guide
      - guide_site
      - guide_lang
      - subdivision
      - city
      - kind
      - origem
      - health_ext
      - api
      - streams
      - _links
      description: 'The record of a channel: everything the search brings, plus the streams and the related links.'
    SaudeMedida:
      type: object
      properties:
        score:
          type: integer
          description: 0–100, moving average of the probes of the channel's best stream.
          nullable: true
        online:
          type: boolean
          description: Some stream of the channel answered `online` in a probe in the 48 h before the last catalog reload.
        checked_at:
          type: string
          description: Instant (ISO-8601) of the most recent recorded probe; the reload writes it again only when something else in the channel changed or every 7 days, so it can be up to one week behind the real probe.
          nullable: true
      required:
      - score
      - online
      - checked_at
      description: 'Observed health of the channel. It is the best measured stream; `null` when nobody measured it: not measured is not bad.'
    LinksSaude:
      type: object
      properties:
        self:
          type: string
          description: This same panel.
        channel:
          type: string
          description: Channel record.
        report:
          type: string
          description: Where to send a new report.
      required:
      - self
      - channel
      - report
      description: Addresses related to the health dashboard.
    SinalPraVoce:
      type: object
      properties:
        nivel:
          type: string
          description: '`geo_bloqueado`, `lenta`, `instavel`, `boa` or `sem_dado`, according to the reports and the response time.'
      required:
      - nivel
      description: Summary for the requester's country. The name `geo_bloqueado` does not confirm a regional block.
    Programa:
      type: object
      properties:
        inicio:
          type: string
          description: Start of the program, ISO 8601.
        fim:
          type: string
          description: End of the program, ISO 8601.
        titulo:
          type: string
          description: Title as the schedule site writes it.
        desc:
          type: string
          description: Short synopsis (up to 300 characters).
        categoria:
          type: string
          description: Category of the site, when it gives one.
      required:
      - inicio
      - fim
      - titulo
      description: A program of the day's schedule, with the instants in ISO 8601 (UTC).
    GeoCanal:
      type: object
      properties:
        tipo:
          type: string
          description: '`geo` (fails in one region, works in another), `down` (fails in every measured region), `ok` or `unknown` (without enough reports).'
        bloqueado_em:
          type: array
          items:
            type: string
          description: Regions where there are only failure reports (cap of 8; `ZZ` = unknown country).
        funciona_em:
          type: array
          items:
            type: string
          description: Countries with at least one success (cap of 8).
        label:
          type: string
          description: Summary of the reported pattern; empty when there is no summary.
      required:
      - tipo
      - bloqueado_em
      - funciona_em
      - label
      description: Comparison of the reported results per country. The pattern can suggest a cause, but it does not confirm it.
    SaudeMedidaStream:
      type: object
      properties:
        status:
          type: string
          description: '`online`, `offline`, `blocked` (geo), `timeout`, `error` or `unknown`.'
        score:
          type: integer
          description: '0–100, moving average: a single failure does not take the stream down.'
          nullable: true
        checked_at:
          type: string
          description: Instant (ISO-8601) of the recorded probe; it is written again when the status or the score changes, or every 7 days.
          nullable: true
        resolution:
          type: string
          description: Observed resolution, e.g. `1080p`.
          nullable: true
        bitrate:
          type: integer
          description: Bitrate in bits per second, when measured.
          nullable: true
        latency_ms:
          type: integer
          description: Time to the first byte in the probe, in ms.
          nullable: true
      required:
      - status
      - score
      - checked_at
      - resolution
      - bitrate
      - latency_ms
      description: The most recent check of this stream; `null` when the stream was not measured.
    MotivoFalha:
      type: object
      properties:
        code:
          type: string
          description: 'Code: `cors`, `geo`, `sumiu`, `codec`, `playlist`, `sem_resposta`, `protocolo`, `sem_stream`, `embed`, `outro`.'
        label:
          type: string
          description: The reason in a short sentence.
        hint:
          type: string
          description: What the person can do about it.
        count:
          type: integer
          description: How many reports brought this code.
        last_at:
          type: string
          description: Most recent report with this code (UTC).
          nullable: true
      required:
      - code
      - label
      - hint
      - count
      - last_at
      description: An aggregated failure reason, already with the text that the interface shows.
    FacetaCategoria:
      type: object
      properties:
        id:
          type: string
          description: Category ID in the catalog, e.g. `news`.
        name:
          type: string
          description: Category name for display.
        count:
          type: integer
          description: Channels of this category within the current filter.
        icon:
          type: string
          description: Name of the icon used in the interface.
          nullable: true
      required:
      - id
      - name
      - count
      - icon
      description: Category with the count within the search just made.
    LatenciaPais:
      type: object
      properties:
        country:
          type: string
          description: Country where the measurement happened, alpha-2.
        samples:
          type: integer
          description: How many data fetches entered the average.
        avg_ms:
          type: integer
          description: Average time until the playlist arrives, in milliseconds.
        grade:
          type: string
          description: '`otima` (<600ms), `boa` (<1500ms), `lenta` (<3500ms) or `ruim`.'
        grade_label:
          type: string
          description: The score in one word, for display.
        last_at:
          type: string
          description: Last measurement (UTC).
          nullable: true
      required:
      - country
      - samples
      - avg_ms
      - grade
      - grade_label
      - last_at
      description: Time for the Grade to fetch the broadcast data, grouped by the requester's country. It does not measure the video start.
    LinksCanal:
      type: object
      properties:
        self:
          type: string
          description: This same record in JSON.
        app:
          type: string
          description: The same thing in the human interface.
        api_index:
          type: string
          description: Self-describing API index.
      required:
      - self
      - app
      - api_index
      description: Related URLs, so that the agent does not build a path by hand.
    RegiaoSaude:
      type: object
      properties:
        country:
          type: string
          description: Country, alpha-2; `ZZ` when the edge did not tell.
        plays:
          type: integer
          description: Success reports in this country.
        fails:
          type: integer
          description: Failure reports in this country.
        health:
          type: integer
          description: Success percentage here; `null` without enough reports.
          nullable: true
        latency_ms:
          type: integer
          description: Average time for the Grade to fetch the broadcast data, in milliseconds; only in `your_country`.
          nullable: true
        latency_grade:
          type: string
          description: 'Latency grade: `otima`, `boa`, `lenta` or `ruim`; only in `your_country`.'
          nullable: true
      required:
      - country
      - plays
      - fails
      - health
      - latency_ms
      - latency_grade
      description: Playback results reported in one country, without a split by browser or system.
    PaginaDeComentarios:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comentario'
          description: The items of this page, in the order that the route defines.
        total:
          type: integer
          description: How many items match the filter, ignoring the pagination.
        limit:
          type: integer
          description: Page size actually applied (it can be smaller than the requested one).
        offset:
          type: integer
          description: Offset applied in this page.
        next_offset:
          type: integer
          description: Offset of the next page; `null` when this is the last one.
          nullable: true
        next:
          type: string
          description: 'Absolute URL of the next page, with the same filters: follow it until it comes as `null` to scan everything, without rebuilding the query string.'
          nullable: true
        api:
          type: string
          description: Absolute URL of this listing itself.
        channel_id:
          type: string
          description: Channel that the comments belong to.
        max_length:
          type: integer
          description: Maximum size of a new comment.
      required:
      - items
      - total
      - limit
      - offset
      - next_offset
      - next
      - api
      - channel_id
      - max_length
      description: Page of comments of a channel, with the size cap for the next writer.
    Social:
      type: object
      properties:
        plays:
          type: integer
          description: Reports that the channel played.
        fails:
          type: integer
          description: Reports that the channel failed.
        favorites:
          type: integer
          description: 'How many people marked it as favorite: it counts people, not clicks.'
        comments:
          type: integer
          description: Public comments on the channel.
        last_fail_code:
          type: string
          description: Code of the most recent reported failure.
          nullable: true
        health:
          type: integer
          description: Success percentage; `null` while there are fewer than 3 reports.
          nullable: true
        your_plays:
          type: integer
          description: Success reports in YOUR browser, system and country.
        your_fails:
          type: integer
          description: 'Failure reports in your environment: this is what tells ''down'' from ''blocked for you''.'
        your_fail_code:
          type: string
          description: Code of the last failure in your environment.
          nullable: true
        your_country_ok:
          type: integer
          description: Success reports in YOUR country, without a split by browser/OS.
        your_country_fail:
          type: integer
          description: Failure reports in your country.
        your_geo_ok:
          type: boolean
          description: '`false` = all the attempts reported in your country failed (a suspected geo-block); `null` without enough reports.'
          nullable: true
        your_latency_ms:
          type: integer
          description: Average playlist latency measured at the hop, at the edge of your country; `null` without a measurement.
          nullable: true
        your_latency_grade:
          type: string
          description: '`otima`, `boa`, `lenta` or `ruim`; `null` without a measurement.'
          nullable: true
      required:
      - plays
      - fails
      - favorites
      - comments
      - last_fail_code
      - health
      - your_plays
      - your_fails
      - your_fail_code
      - your_country_ok
      - your_country_fail
      - your_geo_ok
      - your_latency_ms
      - your_latency_grade
      description: Community counters about a channel, including the extract for the environment and the country of the requester.
    Radio:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          description: Station tags, free vocabulary of the source.
        votes:
