openapi: 3.2.0
info:
  title: GradeTV Account API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Account
paths:
  /api/account/profile:
    get:
      operationId: get_api_account_profile
      summary: Reads your global profile
      description: 'Reads the current preferences of the account. Change them on the account page; products keep no separate authoritative profile.

        Returns: {profile:{name,locale,timeZone,theme,revision}}'
      security:
      - globalAccount: []
      responses:
        '200':
          description: '{profile:{name,locale,timeZone,theme,revision}}'
        '401':
          description: invalid_session
        '503':
          description: auth_unavailable
      tags:
      - Account
  /api/account/avatar:
    get:
      operationId: get_api_account_avatar
      summary: Gets your global profile photo
      description: 'Private WebP of up to 64 KiB, without cache. Change it in the account. It does not accept a user ID or an object URL.

        Returns: image/webp; Cache-Control: no-store'
      security:
      - globalAccount: []
      responses:
        '200':
          description: 'image/webp; Cache-Control: no-store'
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: invalid_session
        '404':
          description: 'not_found: no photo'
        '503':
          description: auth_unavailable
      tags:
      - Account
  /api/account/keys:
    get:
      operationId: get_api_account_keys
      summary: Lists your API keys in this product
      description: 'Never returns the key: name, last 4 characters, organization, creation, last use (per hour) and whether it is still valid.

        Returns: { keys }'
      security:
      - globalAccount: []
      responses:
        '200':
          description: '{ keys }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                    description: '`id`, `name`, `organizationId`, `last4`, `createdAt`, `lastUsedAt`, `revokedAt`, `active` (false when revoked, or stopped by a password change or by ending all sessions).'
                required:
                - keys
        '401':
          description: invalid_session
        '503':
          description: auth_unavailable
      tags:
      - Account
  /api/account/keys/create:
    post:
      operationId: post_api_account_keys_create
      summary: Creates an API key for agents and scripts
      description: 'Requires a sign-in in the last 5 minutes; an organization key also requires a second factor in the session and the owner or administrator role with the product enabled. At most 10 live keys per account and product. The key (`secret`) comes back ONCE.

        Returns: { key, secret }'
      security:
      - globalAccount: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Up to 60 characters.
                organizationId:
                  type:
                  - string
                  - 'null'
                  description: '`null` for an account key.'
              required:
              - name
              - organizationId
            example:
              name: agent
              organizationId: null
      responses:
        '200':
          description: '{ key, secret }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: object
                    description: '`id`, `name`, `organizationId`, `last4`, `createdAt`.'
                  secret:
                    type: string
                    description: '`mmk_…`, shown once.'
                required:
                - key
                - secret
        '400':
          description: invalid_key_name / invalid_organization
        '401':
          description: invalid_session / reauth_required
        '403':
          description: invalid_origin / invalid_csrf / organization_forbidden / organization_mfa_required
        '409':
          description: key_limit_reached
        '503':
          description: auth_unavailable
      tags:
      - Account
  /api/account/keys/revoke:
    post:
      operationId: post_api_account_keys_revoke
      summary: Revokes one of your API keys
      description: 'Stops the key immediately. Repeating does no harm.

        Returns: { ok }'
      security:
      - globalAccount: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The `id` of the key.
              required:
              - id
            example:
              id: …
      responses:
        '200':
          description: '{ ok }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: 'true'
                required:
                - ok
        '400':
          description: invalid_key_id
        '401':
          description: invalid_session
        '403':
          description: invalid_origin / invalid_csrf
        '404':
          description: key_not_found
        '503':
          description: auth_unavailable
      tags:
      - Account
  /api/account/apps:
    get:
      operationId: get_api_account_apps
      summary: Lists the apps connected to your account in this product
      description: 'The MCP clients you signed in with (OAuth), such as claude.ai or ChatGPT. Never returns a token.

        Returns: { apps }'
      security:
      - globalAccount: []
      responses:
        '200':
          description: '{ apps }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      type: object
                    description: 'Up to 50: `id`, `nome` (the app; its host when it identifies itself by a metadata document), `criadoEm`, `usadoEm` (per hour, or null).'
                required:
                - apps
        '401':
          description: invalid_session
        '503':
          description: auth_unavailable
      tags:
      - Account
  /api/account/apps/revoke:
    post:
      operationId: post_api_account_apps_revoke
      summary: Disconnects an app from your account
      description: 'Stops the app''s access at once; it asks you to sign in again. Repeating does no harm.

        Returns: { ok }'
      security:
      - globalAccount: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The `id` of the app.
              required:
              - id
            example:
              id: …
      responses:
        '200':
          description: '{ ok }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: 'true'
                required:
                - ok
        '400':
          description: invalid_app_id
        '401':
          description: invalid_session
        '403':
          description: invalid_origin / invalid_csrf
        '404':
          description: app_not_found
        '503':
          description: auth_unavailable
      tags:
      - Account
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
x-provenance:
  method: harvested
  publisher: Grade
  source: https://gradetv.net/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
