openapi: 3.2.0
info:
  title: GradeTV History API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: History
paths:
  /api/history:
    get:
      operationId: get_history
      summary: Channels the owner watched, from the most recent to the oldest
      description: 'Shows only channels available in the catalog.

        Returns: { items[{channel_id,name,country,logo_url,playable_hint,plays,first_at,last_at,stale,api}], total, limit, offset, next_offset, next, api, max }'
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Items per page. Above 50, it is silently reduced to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: How many items to skip. Use `next_offset` of the previous answer.
      responses:
        '200':
          description: '{ items[{channel_id,name,country,logo_url,playable_hint,plays,first_at,last_at,stale,api}], total, limit, offset, next_offset, next, api, max }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeHistorico'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - History
    post:
      operationId: record_watch
      summary: Records that the owner watched a channel.
      description: 'Returns: { channel_id, plays, last_at, api }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_id:
                  type: string
                  description: Canal assistido, ex. `GloboNews.br`.
              required:
              - channel_id
            example:
              channel_id: GloboNews.br
      responses:
        '200':
          description: '{ channel_id, plays, last_at, api }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_id:
                    type: string
                    description: O canal registrado.
                  plays:
                    type: integer
                    description: How many times the owner already watched this channel.
                  last_at:
                    type: string
                    description: Momento deste registro (UTC).
                    nullable: true
                  api:
                    type: string
                    description: Absolute URL of the history.
                required:
                - channel_id
                - plays
                - last_at
                - api
        '400':
          description: Missing `channel_id` or invalid JSON.
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - History
    delete:
      operationId: clear_history
      summary: Clears the owner's whole history, at once
      description: 'Returns: { ok, cleared, total }'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ ok, cleared, total }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true`.
                  cleared:
                    type: boolean
                    description: 'Always `true`: the history was cleared.'
                  total:
                    type: integer
                    description: 'How many are left: zero.'
                required:
                - ok
                - cleared
                - total
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - History
  /api/history/{channel_id}:
    delete:
      operationId: forget_watch
      summary: Removes a channel from the owner's history
      description: 'Returns: { ok, removed }'
      security:
      - bearerAuth: []
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
        description: Channel to remove from the history, e.g. `GloboNews.br`.
        example: GloboNews.br
      responses:
        '200':
          description: '{ ok, removed }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when it removed.
                  removed:
                    type: string
                    description: The `channel_id` that was removed.
                required:
                - ok
                - removed
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
        '404':
          description: 'The resource does not exist (or it is not yours: the API does not tell the two apart, on purpose).'
      tags:
      - History
components:
  schemas:
    Visita:
      type: object
      properties:
        channel_id:
          type: string
          description: ID of the watched channel.
        name:
          type: string
          description: Channel name; it falls back to the ID if it left the catalog.
        country:
          type: string
          description: Country of the channel.
          nullable: true
        logo_url:
          type: string
          description: Logo served by us.
          nullable: true
        playable_hint:
          type: boolean
          description: Whether the last check found a usable stream.
        plays:
          type: integer
          description: How many times the owner watched this channel.
        first_at:
          type: string
          description: First time watched (UTC).
        last_at:
          type: string
          description: Last time watched (UTC).
        stale:
          type: boolean
          description: '`true` when the channel no longer exists in the catalog.'
        api:
          type: string
          description: Absolute URL of the channel record.
      required:
      - channel_id
      - name
      - country
      - logo_url
      - playable_hint
      - plays
      - first_at
      - last_at
      - stale
      - api
      description: A channel in the owner's history, with how many times the owner watched it.
    PaginaDeHistorico:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Visita'
          description: The items of this page, in the order that the route defines.
        total:
          type: integer
          description: How many items match the filter, ignoring the pagination.
        limit:
          type: integer
          description: Page size actually applied (it can be smaller than the requested one).
        offset:
          type: integer
          description: Offset applied in this page.
        next_offset:
          type: integer
          description: Offset of the next page; `null` when this is the last one.
          nullable: true
        next:
          type: string
          description: 'Absolute URL of the next page, with the same filters: follow it until it comes as `null` to scan everything, without rebuilding the query string.'
          nullable: true
        api:
          type: string
          description: Absolute URL of this listing itself.
        max:
          type: integer
          description: The maximum number of channels that the history keeps.
      required:
      - items
      - total
      - limit
      - offset
      - next_offset
      - next
      - api
      - max
      description: 'Page of the owner''s history. `max` is the cap of stored rows: above it, the oldest one leaves.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
