openapi: 3.2.0
info:
  title: GradeTV Library API
  version: 1d751aaf
  description: Find TV and radio, check the schedule and organize personal lists. Present authorized broadcast projects for evaluation, without activation.
servers:
- url: https://gradetv.net
tags:
- name: Library
paths:
  /api/library:
    get:
      operationId: get_library
      summary: 'The owner''s whole gallery: folders, sub-tabs, channels and the feed URLs of…'
      description: 'Returns: { owner, feeds{m3u,m3u8,json,xspf}, categories[{id,name,slug,sort,last_group_id,api,feeds,groups}] }'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ owner, feeds{m3u,m3u8,json,xspf}, categories[{id,name,slug,sort,last_group_id,api,feeds,groups}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Biblioteca'
        '401':
          description: No credential or invalid credential. See the auth of this endpoint.
      tags:
      - Library
components:
  schemas:
    ItemBiblioteca:
      type: object
      properties:
        id:
          type: string
          description: Item ID in the library, `itm_…`.
        channel_id:
          type: string
          description: Channel ID in the catalog, e.g. `GloboNews.br`.
        stream_id:
          type: string
          description: Stream chosen for this item.
          nullable: true
        name:
          type: string
          description: Channel name; it falls back to the `channel_id` if the channel left the catalog.
        logo_url:
          type: string
          description: Logo served by us.
          nullable: true
        url:
          type: string
          description: Playback URL at the hop; `null` when the stream disappeared.
          nullable: true
        quality:
          type: string
          description: Quality of the chosen stream.
          nullable: true
        kind:
          type: string
          description: 'Media type: `hls`, `mpd`, `mp4`…'
        playable_hint:
          type: boolean
          description: Whether the last check found the stream usable.
        stale:
          type: boolean
          description: '`true` when the channel or the stream disappeared from the source: the item stays, without playing.'
        sort:
          type: integer
          description: Position within the sub-tab.
      required:
      - id
      - channel_id
      - stream_id
      - name
      - logo_url
      - url
      - quality
      - kind
      - playable_hint
      - stale
      - sort
      description: A channel inside a sub-tab, with the stream already chosen.
    PastaBiblioteca:
      type: object
      properties:
        id:
          type: string
          description: Folder ID, `cat_…`.
        name:
          type: string
          description: Name that the owner gave.
        slug:
          type: string
          description: Version of the name used in the feed URL.
        sort:
          type: integer
          description: Position in the owner's sort order.
        last_group_id:
          type: string
          description: 'Last opened sub-tab: this is what returns the person to where they stopped.'
          nullable: true
        api:
          type: string
          description: URL absoluta desta pasta.
        feeds:
          allOf:
          - $ref: '#/components/schemas/Feeds'
          description: Feeds of this folder only.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SubAba'
          description: Sub-tabs inside the folder.
      required:
      - id
      - name
      - slug
      - sort
      - last_group_id
      - api
      - feeds
      - groups
      description: Folder (main tab) of the owner's gallery.
    Biblioteca:
      type: object
      properties:
        owner:
          type: string
          description: 'Label derived from the owner of this tree: stable while the feed is the same, and not reversible. It is NOT the guest token or the account ID: the token is the master credential, without revocation, and the label is derived from it with the feed token.'
        feeds:
          allOf:
          - $ref: '#/components/schemas/Feeds'
          description: Feeds of the whole library, in four formats.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PastaBiblioteca'
          description: The owner's folders, in the order the owner set.
      required:
      - owner
      - feeds
      - categories
      description: 'The owner''s whole gallery: folders, sub-tabs, channels and the feed URLs of each level.'
    Feeds:
      type: object
      properties:
        m3u:
          type: string
          description: 'M3U playlist: this is what you paste in VLC.'
        m3u8:
          type: string
          description: The same playlist, with the `.m3u8` extension for players that accept only it.
        json:
          type: string
          description: The same list in JSON, for those who build on it.
        xspf:
          type: string
          description: The same list in XSPF, for players that prefer XML.
      required:
      - m3u
      - m3u8
      - json
      - xspf
      description: 'The same content in four formats. They are public URLs, with the feed token in the path: whoever has the link has the content.'
    SubAba:
      type: object
      properties:
        id:
          type: string
          description: Sub-tab ID, `grp_…`.
        name:
          type: string
          description: Name that the owner gave.
        slug:
          type: string
          description: Version of the name used in the feed URL.
        sort:
          type: integer
          description: Sort position within the folder.
        last_item_id:
          type: string
          description: Last channel played in this sub-tab.
          nullable: true
        api:
          type: string
          description: URL absoluta desta sub-aba.
        feeds:
          allOf:
          - $ref: '#/components/schemas/Feeds'
          description: Feeds of this sub-tab only.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemBiblioteca'
          description: Channels placed here, in the owner's order.
      required:
      - id
      - name
      - slug
      - sort
      - last_item_id
      - api
      - feeds
      - items
      description: Sub-tab inside a folder; it is the level that groups the channels.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ipt_… (guest); the account is a cookie, never a bearer
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - tv-guide
  - media
  - directory
  docs:
    homepage: https://gradetv.net/
    apiReference: https://gradetv.net/developers
    llms: https://gradetv.net/llms.txt
